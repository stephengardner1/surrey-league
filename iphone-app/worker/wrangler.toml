# Surrey League Compendium notifications back office
name = "sl-notify"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
APNS_TOPIC = "org.slarchive.app"
APNS_KEY_ID = "ZQWL67D4QM"      # 10 characters, shown when Steve creates the push key
APNS_TEAM_ID = "TR7WKKL578"     # 10 characters, top right of developer.apple.com/account
APPROVAL = "on"                 # pilot: every batch waits for Steve's approval (new results from the fast race-day check skip this)
GITHUB_REPO = "stephengardner1/surrey-league"
# Fast race-day results: the league's match ids to watch (surreyleague.org/match/<id>/), from 1pm on match day.
# Timing drill: add {"id":196,"match":2,"date":"<today>","rehearse":true} to replay Match 2 through the whole live chain
# to the approver phone only, then take it out again (see claude/fast-notifications-plan.md).
FAST_MATCHES = '[{"id":197,"match":3,"date":"2027-01-16"},{"id":198,"match":4,"date":"2027-02-13"}]'

[[d1_databases]]
binding = "DB"
database_name = "sl-notify"
database_id = "5a6d1819-4c6e-41cd-98a2-7a3562e0013b"      # filled in when the database is created

[triggers]
crons = ["* * * * *"]           # every minute: carry on sending any batch in progress, and the fast race-day check

# Published from GitHub by the "Publish back office" Action (first run 21 Nov 2026); each publish also rings the Fast results Action once as a check
