# Sends app notifications whenever results or corrections are published.
# Lives in the website's GitHub repository (stephengardner1/surrey-league).
name: App notifications

on:
  workflow_dispatch:      # "Run workflow" button
    inputs:
      mode:
        description: 'check = test the connection (sends nothing). rehearse = replay the latest race as if just published, to the approver phone only'
        type: choice
        options: [check, rehearse]
        default: check
  push:
    branches: [main]
    paths:
      - files/data.json
      - files/data-women.json
      - notifier/rehearse.txt

concurrency:
  group: app-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write and send notifications
        env:
          SL_API: ${{ secrets.SL_API }}
          SL_ADMIN_KEY: ${{ secrets.SL_ADMIN_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node notifier/notify.mjs --${{ inputs.mode || 'check' }}
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qx notifier/rehearse.txt; then
            # Claude can start a rehearsal by changing that file, or replay one real update with a line "replay: <commit>"
            R=$(grep -m1 -oE '^replay: [0-9a-f]{7,40}' notifier/rehearse.txt | cut -d' ' -f2 || true)
            if [ -n "$R" ]; then node notifier/notify.mjs "$R~1" "$R"; else node notifier/notify.mjs --rehearse; fi
          else
            node notifier/notify.mjs "${{ github.event.before }}" "${{ github.sha }}"
          fi
