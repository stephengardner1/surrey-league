# Builds the version of the Android app that gets uploaded to Google Play (an ".aab" file).
# Only runs from the "Run workflow" button. The finished file appears under "Artifacts" on the run's page;
# download it and upload it in Play Console.
#
# Needs two GitHub secrets (Settings > Secrets and variables > Actions), set up once:
#   ANDROID_UPLOAD_KEYSTORE_B64  the upload key file, as text
#   ANDROID_UPLOAD_PASSWORD      its password
# How to create them: see the project note claude/android-app.md.
name: Android release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name shown on Google Play (for example 1.0)
        default: '1.0'
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the upload key has been set up
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::The upload key secrets are missing. Add ANDROID_UPLOAD_KEYSTORE_B64 and ANDROID_UPLOAD_PASSWORD first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the app's copy of slarchive.org
        working-directory: iphone-app
        run: |
          npm ci --no-audit --no-fund
          npm run sync-android
      - name: Build and sign the Google Play file
        working-directory: iphone-app/android
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          SL_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          SL_VERSION: ${{ inputs.version }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.p12"
          export SL_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.p12"
          export SL_BUILD=$(date -u +%y%m%d%H%M) SL_CODE=$(( $(date -u +%s) / 60 ))
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.p12"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/surrey-league-$SL_VERSION-$SL_BUILD.aab"
          echo "Version code: $SL_CODE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: surrey-league-google-play
          path: ${{ runner.temp }}/surrey-league-*.aab
          retention-days: 14
