# Keeps files/sitemap.xml (the list of every page, for Google and other search engines) in step with the results.
# Runs whenever the results data or the form guide pages change, and once a day as a backstop.
name: Sitemap
on:
  schedule:
    - cron: '43 4 * * *'
  push:
    branches: [main]
    paths:
      - files/data.json
      - files/data-women.json
      - files/form-guide/**
      - tools/build_sitemap.mjs
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sitemap
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/build_sitemap.mjs
            files/data.json
            files/data-women.json
            files/form-guide
            files/sitemap.xml
          sparse-checkout-cone-mode: false
      - name: Rebuild the sitemap and save if changed
        run: |
          node tools/build_sitemap.mjs
          git add files/sitemap.xml
          if git diff --cached --quiet; then echo "Already up to date"; exit 0; fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Sitemap: update from the results data"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
