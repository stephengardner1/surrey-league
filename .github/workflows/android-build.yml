# Builds the Android version of the Surrey League app in the cloud (no Android Studio needed),
# then opens it on a pretend Android phone and takes screenshots of each tab.
# Screenshots are saved to the "android-latest" tag of this repository:
#   https://github.com/stephengardner1/surrey-league/tree/android-latest
# The install file for testers is attached to the "Android test build" pre-release:
#   https://github.com/stephengardner1/surrey-league/releases/download/android-latest/surrey-league-test.apk
# Runs when the app's code changes on the android-app branch, or from the "Run workflow" button.
name: Android build
on:
  push:
    branches: [android-app]
    paths:
      - iphone-app/**
      - .github/workflows/android-build.yml
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the app's copy of slarchive.org
        working-directory: iphone-app
        run: |
          npm ci --no-audit --no-fund
          npm run sync-android
      - name: Build the install file
        working-directory: iphone-app/android
        run: |
          export SL_BUILD=$(date -u +%y%m%d%H%M) SL_CODE=$(( $(date -u +%s) / 60 ))
          echo "SL_BUILD=$SL_BUILD" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$RUNNER_TEMP/out/screens"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/surrey-league-test.apk"
      - name: Let the pretend phone run at full speed
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on a pretend Android phone and take screenshots
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash iphone-app/scripts/android-screenshots.sh "${{ runner.temp }}/out"
      - name: Save the screenshots to the android-latest tag and attach the install file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/out"
          mv surrey-league-test.apk "$RUNNER_TEMP/surrey-league-test.apk"
          ls -la "$RUNNER_TEMP/surrey-league-test.apk" screens > build-log.txt 2>&1 || true
          {
            echo "# Surrey League Android test build $SL_BUILD"
            echo
            echo "Built from commit $GITHUB_SHA on the android-app branch."
            echo
            echo "- Install file for testers (not the Play Store version): https://github.com/$GITHUB_REPOSITORY/releases/download/android-latest/surrey-league-test.apk"
            echo "- screens/: screenshots from a pretend Android phone"
          } > README.md
          git init -q -b android-latest
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Android test build $SL_BUILD"
          git tag -f android-latest
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refs/tags/android-latest
          gh release view android-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create android-latest -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Android test build" --notes "Test build of the Surrey League app for Android. Not the Play Store version."
          gh release upload android-latest "$RUNNER_TEMP/surrey-league-test.apk" -R "$GITHUB_REPOSITORY" --clobber
          gh release edit android-latest -R "$GITHUB_REPOSITORY" --notes "Test build $SL_BUILD of the Surrey League app for Android. Not the Play Store version."
