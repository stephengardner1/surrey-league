name: Sync aliases from Google Sheet

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:       # Manual trigger

# Only one sync at a time; a newer push cancels an older run still in progress
concurrency:
  group: sync-aliases
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip if the push was from this workflow (avoid infinite loop)
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Sync aliases
        run: node files/sync-aliases.js files/data.json

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add files/data.json
          if git diff --staged --quiet; then
            echo "No alias changes - nothing to push"
            exit 0
          fi
          git commit -m "Sync aliases from Google Sheet"
          # Pick up anything pushed while this run was working, then push
          git pull --rebase origin main
          git push
