// Hash-based routing utilities
const seasonToCompact=(s)=>s?s.replace('/','').slice(-4):''; // "2013/14" -> "1314"
const compactToSeason=(c)=>{if(!c||c.length!==4)return null;const y1=parseInt(c.slice(0,2));const y2=parseInt(c.slice(2,4));const prefix=y1>=62&&y1<=99?'19':'20';return `${prefix}${c.slice(0,2)}/${c.slice(2,4)}`;};
const nameToSlug=(n)=>n?.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')||'';
const slugToName=(s,athletes)=>{if(!s)return null;const slug=s.toLowerCase();const match=athletes?.find(a=>nameToSlug(a.name)===slug);return match?.name||s.replace(/-/g,' ');};

// Athlete pages have real paths (/athlete/<slug>, /women/athlete/<slug>) so links shared on social/WhatsApp get their own preview
const athletePathRoute=()=>{if(/^\/analysis\/?$/i.test(window.location.pathname))return 'analysis';const m=window.location.pathname.match(/^\/(women\/)?athlete\/([^\/]+)\/?$/i);if(m)return (m[1]?'women/':'')+'athlete/'+decodeURIComponent(m[2]).replace(/-poster$/i,'');const r=window.location.pathname.match(/^\/(women\/)?race\/(\d{4}-\d+(?:\/form-guide|\/compare)?)\/?$/i);return r?((r[1]?'women/':'')+'race/'+r[2]):null;};  /* path addresses: /athlete/<slug> and /race/<season>-<match>, so link previews can describe them */
/* the opened, downloadable sticker has its own address: /athlete/<slug>-poster (and /women/athlete/<slug>-poster) */
const isPosterUrl=()=>/^\/(women\/)?athlete\/[^\/]+-poster\/?$/i.test(window.location.pathname);
(()=>{const m=window.location.hash.match(/^#(women\/)?(athlete|race)\/(.+)$/i);if(m)window.history.replaceState(null,'',(m[1]?'/women':'')+'/'+m[2].toLowerCase()+'/'+m[3]);})();  /* old #athlete/ and #race/ links move to their path address */
const parseUrlParams=(athletes)=>{
  const hash=(window.location.hash.slice(1)||athletePathRoute()||'').toLowerCase();
  if(!hash)return{type:'home',division:'men'};
  
  // Check for women prefix
  const isWomen=hash.startsWith('women');
  const division=isWomen?'women':'men';
  const cleanHash=isWomen?(hash.startsWith('women/')?hash.slice(6):(hash==='women'?'':hash.slice(5))):hash;
  
  if(!cleanHash)return{type:'home',division};
  const[route,...rest]=cleanHash.split('/');
  const param=rest.join('/');
  switch(route){
    case'season':return{type:'home',urlSeason:compactToSeason(param),division};
    case'athlete':{const ps=param.replace(/-poster$/i,'');const nm=slugToName(ps,athletes);if(isUnknownAthlete(nm))return{type:'athletes',division};return{type:'athlete',athlete:{name:nm,slug:ps},division};}
    case'club':return{type:'club',club:param.toUpperCase().replace('HW','H/W').replace('GG','G&G').replace('CC','C/C').replace('EE','E&E').replace('SD','S&D'),division};
    case'race':{const[s,m]=param.split('-');return{type:'race',raceKey:{season:compactToSeason(s),match:parseInt(m)},mode:param.endsWith('/form-guide')?'guide':param.endsWith('/compare')?'compare':undefined,division};}
    case'fixtures':return{type:'fixtures',division};
    case'winners':return{type:'seasons',division};
    case'athletes':return{type:'athletes',division};
    case'clubs':return{type:'clubs',division};
    case'h2h':return{type:'h2h',division};
    case'chartroom':return{type:'chartroom',division};
    case'origin':return{type:'origin',division};
    case'analysis':return{type:'analysis',division};
    default:return{type:'home',division};
  }
};

/* a season address for a season this division doesn't have (e.g. women's 1964/65): the latest season instead */
const seasonFix=(parsed,D)=>parsed.type==='home'&&parsed.urlSeason&&D&&!D.seasons?.includes(parsed.urlSeason)?{...parsed,urlSeason:undefined}:parsed;
/* a race address with no such race (e.g. a women's fixture before the women's league began): that season's page if it exists, else the latest */
const raceMissView=(parsed,D)=>({type:'home',urlSeason:D?.seasons?.includes(parsed.raceKey.season)?parsed.raceKey.season:undefined});
const updateUrl=(view,division='men')=>{
  const prefix=division==='women'?'#women':'#';
  const sep=division==='women'?'/':'';
  let hash='';
  if(view.type==='home'&&view.urlSeason)hash=prefix+sep+'season/'+seasonToCompact(view.urlSeason);
  else if(view.type==='home'&&division==='women')hash='#women';
  else if(view.type==='athlete'&&view.athlete?.name)hash=prefix+sep+'athlete/'+nameToSlug(view.athlete.name);
  else if(view.type==='club'&&view.club)hash=prefix+sep+'club/'+view.club.toLowerCase().replace('/','').replace('&','');
  else if(view.type==='race'&&view.race)hash=prefix+sep+'race/'+seasonToCompact(view.race.season)+'-'+view.race.match+(view.mode==='guide'?'/form-guide':view.mode==='compare'?'/compare':'');
  else if(view.type==='fixtures')hash=prefix+sep+'fixtures';
  else if(view.type==='seasons')hash=prefix+sep+'winners';
  else if(view.type==='athletes')hash=prefix+sep+'athletes';
  else if(view.type==='clubs')hash=prefix+sep+'clubs';
  else if(view.type==='h2h')hash=prefix+sep+'h2h';
  else if(view.type==='chartroom')hash=prefix+sep+'chartroom';
  else if(view.type==='origin')hash=prefix+sep+'origin';
  const target=view.type==='analysis'?'/analysis':(view.type==='athlete'&&view.athlete?.name)?(division==='women'?'/women':'')+'/athlete/'+nameToSlug(view.athlete.name):(view.type==='race'&&view.race)?(division==='women'?'/women':'')+'/race/'+seasonToCompact(view.race.season)+'-'+view.race.match+(view.mode==='guide'?'/form-guide':view.mode==='compare'?'/compare':''):'/'+hash;
  if(target+'-poster'===window.location.pathname)return;  /* already on this runner's poster address */
  if(target!==window.location.pathname+window.location.hash)window.history.pushState({sl:1},'',target);
};

    const colOrder=['wins','top3','top5','top10','top20','top50','top100','races'];const allTimeRank=athletes.filter(x=>!x.historical).sort((a,b)=>{for(const col of colOrder){const d=(b[col]||0)-(a[col]||0);if(d!==0)return d;}return a.name.localeCompare(b.name);}).findIndex(x=>namesMatch(x.name,found.name))+1;
    const positions=[];
    let bestRace=null;
    let bestPos=Infinity;
    races.filter(r=>r.results?.length).forEach(race=>{
      const result=race.results.find(r=>namesMatch(r.name,a.name));
      if(result){
        positions.push(result.pos);
        if(result.pos<bestPos){bestPos=result.pos;bestRace=race;}
      }
    });
    const avgPos=positions.length>0?positions.reduce((a,b)=>a+b,0)/positions.length:0;
    return{...found,allTimeRank,avgPos,bestPos:bestPos===Infinity?0:bestPos,bestRace};
  };
  
  const computeH2H=()=>{
    if(!athlete1||!athlete2)return null;
    let wins1=0,wins2=0,ties=0;
    const sharedRaces=[];
    races.filter(r=>r.results?.length).forEach(race=>{
      const r1=race.results.find(r=>namesMatch(r.name,athlete1.name));
      const r2=race.results.find(r=>namesMatch(r.name,athlete2.name));
      if(r1&&r2){
        sharedRaces.push({race,pos1:r1.pos,pos2:r2.pos});
        if(r1.pos<r2.pos)wins1++;
        else if(r2.pos<r1.pos)wins2++;
        else ties++;
      }
    });
    return{wins1,wins2,ties,sharedRaces,total:sharedRaces.length};
  };
  
  const stats1=getStats(athlete1);
  const stats2=getStats(athlete2);
  const h2h=computeH2H();
  
  const StatRow=({label,val1,val2,better='lower',onClick1,onClick2})=>{
    const n1=typeof val1==='string'&&val1.startsWith('#')?parseInt(val1.slice(1)):parseFloat(val1);
    const n2=typeof val2==='string'&&val2.startsWith('#')?parseInt(val2.slice(1)):parseFloat(val2);
    const w1=better==='lower'?n1<n2:n1>n2;
    const w2=better==='lower'?n2<n1:n2>n1;
    // Form guide green (--over) for the better figure; the other stays plain
    const color1=w1?'text-[#1a8a6f] font-semibold':w2?'text-gray-700':'text-gray-700';
    const color2=w2?'text-[#1a8a6f] font-semibold':w1?'text-gray-700':'text-gray-700';
    return<tr>
      <td className={`py-2 pr-3 text-right text-base tabular-nums ${color1} ${onClick1?'cursor-pointer hover:underline':''}`} onClick={onClick1}>{val1}</td>
      <td className="py-2 px-2 text-center text-[11px] md:text-xs text-gray-500 uppercase tracking-wide whitespace-nowrap">{label}</td>
      <td className={`py-2 pl-3 text-left text-base tabular-nums ${color2} ${onClick2?'cursor-pointer hover:underline':''}`} onClick={onClick2}>{val2}</td>
    </tr>;
  };
  
  return<div className="max-w-5xl mx-auto px-4 pt-3 md:pt-6 pb-8">
    <div className="max-w-3xl">
    <h1 className="text-2xl font-bold text-gray-900 mb-6">Head to Head</h1>
    
    <div className="relative flex items-center gap-3 mb-8">

      <div className="text-xs text-gray-500 uppercase tracking-wide">vs</div>
      <AthleteInput label="Second athlete" value={athlete2} onChange={setAthlete2} onSelect={setAthlete2} athletes={athletes.filter(a=>!a.historical)} placeholder="Search athlete..."/>
    </div>
    
    {stats1&&stats2&&h2h&&<div>
      <table className="w-full max-w-md mx-auto mb-10 table-fixed">
        <colgroup><col/><col className="w-28 md:w-40"/><col/></colgroup>
        <tbody className="divide-y divide-gray-100">
          <tr className="!border-0">
            <td className="pb-3 align-bottom"><div className="flex justify-end cursor-pointer" data-ath={stats1.name} data-ath-find="" title={stats1.name} onClick={()=>setView({type:'athlete',athlete:athlete1})}><AthletePortrait key={stats1.name} name={stats1.name} club={stats1.club} w={104}/></div></td>
            <td className="pb-3 align-bottom text-center text-[11px] md:text-xs text-gray-500 uppercase tracking-wide">{h2h.total} shared<br/>races</td>
            <td className="pb-3 align-bottom"><div className="flex justify-start cursor-pointer" data-ath={stats2.name} data-ath-find="" title={stats2.name} onClick={()=>setView({type:'athlete',athlete:athlete2})}><AthletePortrait key={stats2.name} name={stats2.name} club={stats2.club} w={104}/></div></td>

            <td className={`py-3 pl-3 text-left text-3xl tabular-nums ${h2h.wins2>h2h.wins1?'text-[#1a8a6f] font-semibold':h2h.wins2<h2h.wins1?'text-gray-700':'text-gray-700'}`}>{h2h.wins2}</td>
          </tr>
          <StatRow label="A-Team Scores" val1={stats1.aScores||0} val2={stats2.aScores||0} better="higher"/>
          <StatRow label="Avg Finish" val1={(stats1.avgPos||0).toFixed(1)} val2={(stats2.avgPos||0).toFixed(1)} better="lower"/>
          <StatRow label="Best Finish" val1={stats1.bestPos||'-'} val2={stats2.bestPos||'-'} better="lower" onClick1={stats1.bestRace?()=>setView({type:'race',race:stats1.bestRace}):null} onClick2={stats2.bestRace?()=>setView({type:'race',race:stats2.bestRace}):null}/>
          <StatRow label="Total Races" val1={stats1.races||0} val2={stats2.races||0} better="higher"/>
          <StatRow label="All-Time Rank" val1={stats1.allTimeRank>0?'#'+stats1.allTimeRank:'-'} val2={stats2.allTimeRank>0?'#'+stats2.allTimeRank:'-'} better="lower"/>

      {h2h.sharedRaces.length>0&&<div>

            {h2h.sharedRaces.slice().reverse().map((sr,i)=><tr key={i} className="hover:bg-blue-50 cursor-pointer" onClick={()=>setView({type:'race',race:sr.race})}>
              <td className="py-2 text-sm"><span className="text-gray-500 inline-block w-16">{(()=>{const d=parseDate(sr.race.date);return d&&!isNaN(d)?d.toLocaleDateString('en-GB',{month:'short'})+" '"+String(d.getFullYear()).slice(2):formatDate(sr.race.date);})()}</span><span className="text-gray-900"><VenueName venue={sr.race.venue}/></span></td>
              <td className={`py-2 px-2 text-sm text-right tabular-nums ${sr.pos1<sr.pos2?'text-[#1a8a6f] font-semibold':sr.pos1>sr.pos2?'text-gray-700':'text-gray-500'}`}>{sr.pos1}</td>

            </tr>)}
          </tbody>
        </table>
      </div>}
    </div>}
    
    {(!athlete1||!athlete2)&&<div className="py-12 text-sm text-gray-500">
      <p>Pick two athletes to compare</p>
    </div>}
    </div>
  </div>;
};

// Normalize data to merge case-variant athlete names
// 
// HISTORICAL RECORDS PRINCIPLE:
// For seasons before 2013/14, league standings from historical documents (Athletics Weekly,
// club records, official results sheets) are AUTHORITATIVE and must never be overwritten
// by calculations from individual race results. We can't rewrite history - if a document
// says AFD won 1984/85 with 684 points, that's the official record regardless of what
// our partial individual results might suggest. This is enforced in the standings
// calculation logic which prioritizes seasonsData.standings for pre-modern era seasons.
//
const normalizeData=(data,division='men',liveAliases={})=>{
  const divConfig=DIVISIONS[division];
  
  // Expand minified result fields (p->pos, n->name, c->club, t->time, s->pts, b_s/b->b_pts, x->ns)
  data.races.forEach(race=>{
    if(race.results){
      race.results=race.results.map(r=>{
        if(r.p!==undefined||r.n!==undefined){
          return{
            pos:r.p??r.pos,
            name:r.n??r.name,
            club:r.c??r.club,
            time:r.t??r.time,
            ...(r.s!=null||r.pts!=null?{pts:r.s??r.pts}:{}),
            ...(r.b_s!=null||r.b!=null||r.b_pts!=null?{b_pts:r.b_s??r.b??r.b_pts}:{}),
            ...(r.x!=null||r.ns!=null||r.nonScorer!=null?{ns:r.x??r.ns??r.nonScorer}:{}),
            ...(r.sc||r.secondClaim?{secondClaim:true}:{}),
            ...(r.sEst?{ptsEst:true}:{})
          };
        }
        return r;
      });
    }
  });

  // Club code remapping (alternate abbreviations → canonical)
  const clubRemap={'RPR':'REI'};
  data.races.forEach(race=>{

  }
  window.__nameAliases={...(window.__nameAliases||{}),...nameAliases}; // used by race photo captions

  const clubSpecificAliases={};

      const key=normalizeNameForCompare(name);

      const clubsForName=new Set();
      data.races.forEach(race=>{
        (race.results||[]).forEach(r=>{
          if(normalizeNameForCompare(r.name)===key || 
             normalizeNameForCompare(r.name)===normalizeNameForCompare(`${name} (${r.club})`)){
            clubsForName.add(normalizeClub(r.club));
          }
        });
      });
      // Create aliases for each club variant
      clubsForName.forEach(club=>{
        if(club){
          clubSpecificAliases[`${key}|${club}`]=`${name} (${club})`;
          // Also handle if already has club suffix
          clubSpecificAliases[`${normalizeNameForCompare(`${name} (${club})`)}|${club}`]=`${name} (${club})`;
        }
      });
    });
  }
  
  // Helper to get canonical name considering club (only for disambiguation)
  const getCanonicalName=(name,club)=>{
    const key=normalizeNameForCompare(name);
    const clubKey=`${key}|${club}`;
    // Only check club-specific alias (for disambiguation)
    if(clubSpecificAliases[clubKey])return clubSpecificAliases[clubKey];
    // For general aliases, don't pass through here - let normal flow handle it
    return null;
  };

  // Handle special dead heat cases - these races have two winners with their clubs
  const deadHeats={
    '1966/67-4':{winner:'Bob Holt / Gerry North',winners:[{name:'Bob Holt',club:'H/W'},{name:'Gerry North',club:'BEL'}]},
    '1967/68-2':{winner:'Gerry North / Bob Holt',winners:[{name:'Gerry North',club:'BEL'},{name:'Bob Holt',club:'H/W'}]},
    '1969/70-3':{winner:'Bob Holt / Dave Holt',winners:[{name:'Bob Holt',club:'H/W'},{name:'Dave Holt',club:'H/W'}]},
    '1974/75-1':{winner:'Bernie Ford / Peter Adams',winners:[{name:'Bernie Ford',club:'AFD'},{name:'Peter Adams',club:'AFD'}]},
    '1997/98-4':{winner:'Kassa Tadesse / Gary Staines',winners:[{name:'Kassa Tadesse',club:'BEL'},{name:'Gary Staines',club:'BEL'}]}
  };
  
  // Pre-process races to handle dead heats and name fixes
  data.races.forEach(race=>{
    const raceKey=`${race.season}-${race.match}`;
    // Apply dead heat data
    if(deadHeats[raceKey]){
      race.winner=deadHeats[raceKey].winner;

      m.wins=(m.wins||0)+(a.wins||0);
      m.top3=(m.top3||0)+(a.top3||0);
      m.top5=(m.top5||0)+(a.top5||0);

      m.aScores=(m.aScores||0)+(a.aScores||0);
      // Merge clubs array (normalized)
      if(!m.clubs)m.clubs=[m.club];
      const normClub=normalizeClub(a.club);
      if(normClub&&!m.clubs.includes(normClub))m.clubs.push(normClub);

  data.athletes=Object.values(mergedAthletes);
  
  // Normalize names in race results (with club-specific alias support)
  data.races.forEach(race=>{

      const club=normalizeClub(r.club);
      // Check club-specific alias first
      const clubSpecific=getCanonicalName(r.name,club);
      if(clubSpecific){
        // Check if the club-specific name has a further alias (e.g. "D Hill (THH)" -> "Dave Hill")
        const csKey=normalizeNameForCompare(clubSpecific);
        r.name=nameMap[csKey]||clubSpecific;
      }else{
        const key=normalizeNameForCompare(r.name);
        if(nameMap[key])r.name=nameMap[key];
      }
    });
  });
  
  // Normalize names in seasonsData individualRankings
  Object.values(data.seasonsData||{}).forEach(sd=>{
    (sd.individualRankings||[]).forEach(r=>{
      const key=normalizeNameForCompare(r.name);
      if(nameMap[key])r.name=nameMap[key];
    });
  });

  // Same name, different runners (nameCollisions): winners and Mitchell Cup lists use the plain name,
  // but the runner's page is "Name (CLUB)". Point them at the right page, e.g. Dave Taylor at HHH.
  const collisionName=(name,club)=>{
    if(!name||!club)return name;
    const cs=getCanonicalName(name,normalizeClub(club));
    return cs?(nameMap[normalizeNameForCompare(cs)]||cs):name;
  };
  data.races.forEach(race=>{if(race.winner&&!race.deadHeat)race.winner=collisionName(race.winner,race.winnerClub);});
  Object.values(data.seasonsData||{}).forEach(sd=>{
    (sd.individualRankings||[]).forEach(r=>{r.name=collisionName(r.name,r.club);});
    (sd.matches||[]).forEach(m=>{if(m.winner&&!String(m.winner).includes(' / '))m.winner=collisionName(m.winner,m.winnerClub);});
  });
  Object.values(data.mitchellCupWinners||{}).forEach(ws=>{(Array.isArray(ws)?ws:[]).forEach(w=>{if(w&&w.name)w.name=collisionName(w.name,w.club);});});
  
  // Normalize names in clubMvps
  Object.keys(data.clubMvps||{}).forEach(club=>{
    data.clubMvps[club].forEach(m=>{
      const key=normalizeNameForCompare(m.name);
      if(nameMap[key])m.name=nameMap[key];
    });
  });
  
  // Recompute athlete stats from ALL race results (including historical)
  const athleteStats={};
  data.races.forEach(race=>{
    (race.results||[]).forEach(r=>{
      if(!r.name||isUnknownAthlete(r.name))return;
      const key=normalizeNameForCompare(r.name);
      if(!athleteStats[key]){
        athleteStats[key]={name:r.name,club:r.club,wins:0,top3:0,top5:0,top10:0,top20:0,top50:0,top100:0,races:0,aScores:0,clubs:new Set()};
      }
      const s=athleteStats[key];
      s.races++;
      s.clubs.add(r.club);
      {const rk=(race.season||'')+'|'+String(race.match||0).padStart(2,'0');if(r.club&&!['GUEST','G','N/S'].includes(r.club)&&(!s.lastKey||rk>=s.lastKey)){s.lastKey=rk;s.lastClub=r.club;}}
      if(r.pos===1||r.pos==='=1')s.wins++;
      if(r.pos<=3||r.pos==='=1')s.top3++;
      if(r.pos<=5||r.pos==='=1')s.top5++;
      if(r.pos<=10||r.pos==='=1')s.top10++;
      if(r.pos<=20||r.pos==='=1')s.top20++;
      if(r.pos<=50||r.pos==='=1')s.top50++;
      if(r.pos<=100||r.pos==='=1')s.top100++;
      // Count A-team scores based on pts field (set for A-team scorers)
      if(r.pts)s.aScores++;
    });
  });
  
  // Also count historical races that aren't in race results
  data.athletes.forEach(a=>{
    if(!a.historicalRaces)return;
    const key=normalizeNameForCompare(a.name);
    a.historicalRaces.forEach(hr=>{
      // Check if this race is already in results
      const race=data.races.find(r=>r.season===hr.season&&r.match===hr.match);
      const alreadyCounted=race?.results?.some(res=>normalizeNameForCompare(res.name)===key);
      if(alreadyCounted)return;
      // Count this historical race
      if(!athleteStats[key]){
        athleteStats[key]={name:a.name,club:hr.club||a.club,wins:0,top3:0,top5:0,top10:0,top20:0,top50:0,top100:0,races:0,aScores:0,clubs:new Set()};
      }
      const s=athleteStats[key];
      s.races++;
      s.clubs.add(hr.club||a.club);
      if(hr.pos===1){s.wins++;s.top3++;s.top5++;s.top10++;s.top20++;s.top50++;s.top100++;}
      else if(hr.pos<=3){s.top3++;s.top5++;s.top10++;s.top20++;s.top50++;s.top100++;}
      else if(hr.pos<=5){s.top5++;s.top10++;s.top20++;s.top50++;s.top100++;}
      else if(hr.pos<=10){s.top10++;s.top20++;s.top50++;s.top100++;}
      else if(hr.pos<=20){s.top20++;s.top50++;s.top100++;}
      else if(hr.pos<=50){s.top50++;s.top100++;}
      else if(hr.pos<=100){s.top100++;}
    });
  });
  
  // Merge computed stats with existing athletes
  data.athletes.forEach(a=>{
    const key=normalizeNameForCompare(a.name);
    if(athleteStats[key]){
      const s=athleteStats[key];
      // Use computed stats from race results
      a.wins=s.wins;
      a.top3=s.top3;
      a.top5=s.top5;
      a.top10=s.top10;
      a.top20=s.top20;
      a.top50=s.top50;
      a.top100=s.top100;
      a.races=s.races;
      a.aScores=s.aScores;
      if(s.lastClub)a.club=s.lastClub; // headline club = most recent club
      // Merge clubs
      if(!a.clubs)a.clubs=[a.club];
      s.clubs.forEach(c=>{if(!a.clubs.includes(c))a.clubs.push(c);});
      delete athleteStats[key]; // Mark as processed
    }
  });
  
  // Add athletes that only exist in race results (not in original athletes array)
  Object.values(athleteStats).forEach(s=>{
    s.clubs=Array.from(s.clubs);
    s.club=s.lastClub||s.clubs[0]; // most recent club, so the profile shows their current vest
    delete s.lastKey;delete s.lastClub;
    data.athletes.push(s);
  });
  // Unnamed runners are not athletes
  data.athletes=data.athletes.filter(a=>!isUnknownAthlete(a.name));

  // Ensure clubAllTime is an array (may be empty object in women's data)
  if(!Array.isArray(data.clubAllTime)){
    // Build clubAllTime from race results
    const clubStats={};
    data.races.forEach(race=>{
      (race.results||[]).forEach(r=>{
        if(!clubStats[r.club])clubStats[r.club]={club:r.club,races:0,runners:0};
        clubStats[r.club].runners++;
      });
      if(race.teamWinner){
        if(!clubStats[race.teamWinner])clubStats[race.teamWinner]={club:race.teamWinner,races:0,runners:0};
        clubStats[race.teamWinner].races++;
      }
    });
    data.clubAllTime=Object.values(clubStats);
  }else{
    // clubAllTime exists but may be missing clubs that have runners but weren't in Div 1 standings
    const existingClubs=new Set(data.clubAllTime.map(c=>c.club));
    data.races.forEach(race=>{
      (race.results||[]).forEach(r=>{
        if(r.club&&!existingClubs.has(r.club)){
          data.clubAllTime.push({club:r.club,titles:0,seconds:0,thirds:0,seasonCount:0});
          existingClubs.add(r.club);
        }
      });
    });
  }

  // Recompute all club positions from seasonsData (titles, runnerUp, third, fourth, fifth, sixth)
  const placeCount={};
  const clubSeasons={}; // Track which seasons each club appeared in
  Object.entries(data.seasonsData||{}).forEach(([season,sd])=>{
    // Women's format: has 'champion' field explicitly set (string value, indicates complete season)
    // Men's format: no 'champion' field or champion is null/undefined, uses m4 to determine completeness
    
    const hasChampion = sd.champion && typeof sd.champion === 'string';
    
    // Track clubs from teamsInDiv1 array (for seasons with known participants but incomplete standings)
    (sd.teamsInDiv1||[]).forEach(club=>{
      if(!clubSeasons[club])clubSeasons[club]=new Set();
      clubSeasons[club].add(season);
    });
    
    // Also track clubs from matches data (for seasons with incomplete standings)
    (sd.matches||[]).forEach(m=>{
      if(m.winnerClub){
        if(!clubSeasons[m.winnerClub])clubSeasons[m.winnerClub]=new Set();
        clubSeasons[m.winnerClub].add(season);
      }
      if(m.teamWinner){
        if(!clubSeasons[m.teamWinner])clubSeasons[m.teamWinner]=new Set();
        clubSeasons[m.teamWinner].add(season);
      }
    });
    
    // Always count teams present in standings for season tally (even if season incomplete)
    // But only count positions (titles etc) for complete seasons
    (sd.standings||[]).forEach(team=>{
      if(team.club){
        if(!clubSeasons[team.club])clubSeasons[team.club]=new Set();
        clubSeasons[team.club].add(season);
      }
    });
    
    // For women (or any format with champion): count positions if champion is set
    if(hasChampion && sd.standings){
      sd.standings.forEach((team,idx)=>{
        const club = team.club;
        if(!club)return;
        if(!placeCount[club])placeCount[club]={titles:0,runnerUp:0,third:0,fourth:0,fifth:0,sixth:0};
        if(idx===0)placeCount[club].titles++;
        if(idx===1)placeCount[club].runnerUp++;
        if(idx===2)placeCount[club].third++;
        if(idx===3)placeCount[club].fourth++;
        if(idx===4)placeCount[club].fifth++;
        if(idx===5)placeCount[club].sixth++;
      });
      return;
    }
    // Handle historical format with just champion (no standings)
    if(hasChampion && !sd.standings){
      if(!placeCount[sd.champion])placeCount[sd.champion]={titles:0,runnerUp:0,third:0,fourth:0,fifth:0,sixth:0};
      if(!clubSeasons[sd.champion])clubSeasons[sd.champion]=new Set();
      clubSeasons[sd.champion].add(season);
      placeCount[sd.champion].titles++;
      return;
    }
    // Handle men's format: no champion field, standings array with m1,m2,m3,m4 fields
    // Only count positions for complete seasons
    if(!sd?.standings)return;
    const allSeasons=Object.keys(data.seasonsData||{}).sort();
    const mostRecentSeason=allSeasons[allSeasons.length-1];
    const isMostRecent=season===mostRecentSeason;
    // For most recent season: check if 4 races have results
    // For historical seasons: always count as complete
    if(isMostRecent){
      const raceCount=data.races.filter(r=>r.season===season&&r.results?.length>0).length;
      if(raceCount<4)return; // Season not complete yet
    }
    sd.standings.forEach((team,idx)=>{
      if(!placeCount[team.club])placeCount[team.club]={titles:0,runnerUp:0,third:0,fourth:0,fifth:0,sixth:0};
      if(idx===0)placeCount[team.club].titles++;
      if(idx===1)placeCount[team.club].runnerUp++;
      if(idx===2)placeCount[team.club].third++;
      if(idx===3)placeCount[team.club].fourth++;
      if(idx===4)placeCount[team.club].fifth++;
      if(idx===5)placeCount[team.club].sixth++;
    });
  });
  // Add any clubs from standings that aren't in clubAllTime yet
  const existingClubsFromStandings=new Set(data.clubAllTime.map(c=>c.club));
  Object.keys(placeCount).forEach(club=>{
    if(!existingClubsFromStandings.has(club)){
      data.clubAllTime.push({club:club,titles:0,seconds:0,thirds:0,seasonCount:0});
    }
  });
  
  data.clubAllTime.forEach(c=>{
    if(placeCount[c.club]){
      c.titles=placeCount[c.club].titles;
      c.runnerUp=placeCount[c.club].runnerUp;
      c.seconds=placeCount[c.club].runnerUp; // Alias for ClubsView
      c.third=placeCount[c.club].third;
      c.thirds=placeCount[c.club].third; // Alias for ClubsView
      c.fourth=placeCount[c.club].fourth;
      c.fifth=placeCount[c.club].fifth;
      c.sixth=placeCount[c.club].sixth;
    }
    if(clubSeasons[c.club]){
      c.seasonCount=clubSeasons[c.club].size;
    }
  });
  // Re-sort clubAllTime by titles desc, then runnerUp desc
  data.clubAllTime.sort((a,b)=>(b.titles||0)-(a.titles||0)||(b.runnerUp||0)-(a.runnerUp||0)||(b.third||0)-(a.third||0));
  
  // Dynamically compute achievements from race data
  const computeAchievements=()=>{
    // Most wins in a single season
    const seasonWins={};
    data.races.forEach(race=>{
      if(!race.winner||race.deadHeat||race.winnerClub==='GUEST'||race.winnerClub==='GST')return;
      const key=`${race.winner}|${race.winnerClub}|${race.season}`;
      seasonWins[key]=(seasonWins[key]||0)+1;
    });
    const mostWinsSeasonAll=Object.entries(seasonWins).map(([k,wins])=>{
      const[name,club,season]=k.split('|');
      return{name,club,season,wins};
    }).sort((a,b)=>b.wins-a.wins||a.season.localeCompare(b.season));
    // Deduplicate by athlete - show only their best season
    const seenAthletes=new Set();
    const mostWinsSeason=mostWinsSeasonAll.filter(a=>{
      const key=normalizeNameForCompare(a.name);
      if(seenAthletes.has(key))return false;
      seenAthletes.add(key);
      return true;
    }).slice(0,5);
    
    // Consecutive wins (across seasons) - sort by season then match, not by date string
    const winnersByDate=data.races.filter(r=>r.winner&&!r.deadHeat&&r.winnerClub!=='GUEST'&&r.winnerClub!=='GST').sort((a,b)=>a.season.localeCompare(b.season)||a.match-b.match);
    const streaks={};
    let lastWinner=null;
    winnersByDate.forEach(race=>{
      const key=normalizeNameForCompare(race.winner);
      if(!streaks[key])streaks[key]={name:race.winner,club:race.winnerClub,current:0,max:0};
      if(lastWinner===key){
        streaks[key].current++;
      }else{
        streaks[key].current=1;
      }
      streaks[key].max=Math.max(streaks[key].max,streaks[key].current);
      lastWinner=key;
    });
    const mostConsecutiveWins=Object.values(streaks).map(s=>({name:s.name,club:s.club,streak:s.max})).sort((a,b)=>b.streak-a.streak).slice(0,5);
    
    // Biggest races by finishers
    const biggestRaces=data.races.filter(r=>r.finishers).sort((a,b)=>b.finishers-a.finishers).slice(0,5).map(r=>({venue:r.venue,season:r.season,match:r.match,date:r.date,finishers:r.finishers}));
    
    // Most consecutive titles by club
    const allSeasons=Object.keys(data.seasonsData).sort();
    const mostRecentSeason=allSeasons[allSeasons.length-1];
    const seasonsByYear=Object.keys(data.seasonsData).filter(s=>{
      const sd=data.seasonsData[s];
      if(!sd?.standings?.length)return false;
      // For most recent season: check if 4 races have results
      if(s===mostRecentSeason){
        const raceCount=data.races.filter(r=>r.season===s&&r.results?.length>0).length;
        return raceCount>=4;
      }
      // For all other seasons: count as complete
      return true;
    }).sort();
    const clubStreaks={};
    let lastChamp=null;
    seasonsByYear.forEach(season=>{
      const champ=data.seasonsData[season]?.standings?.[0]?.club;
      if(!champ)return;
      if(!clubStreaks[champ])clubStreaks[champ]={current:0,max:0};
      if(lastChamp===champ){
        clubStreaks[champ].current++;
      }else{
        clubStreaks[champ].current=1;
      }
      clubStreaks[champ].max=Math.max(clubStreaks[champ].max,clubStreaks[champ].current);
      lastChamp=champ;
    });
    const mostConsecutiveTitles=Object.entries(clubStreaks).map(([club,s])=>({club,streak:s.max})).sort((a,b)=>b.streak-a.streak).slice(0,5);
    
    // Best turnout by club at a single race
    const turnouts=[];
    data.races.forEach(race=>{
      if(!race.results)return;
      const clubCounts={};
      race.results.forEach(r=>{
        clubCounts[r.club]=(clubCounts[r.club]||0)+1;
      });
      Object.entries(clubCounts).forEach(([club,count])=>{
        turnouts.push({club,count,venue:race.venue,season:race.season,match:race.match,date:race.date});
      });
    });
    const biggestTurnouts=turnouts.sort((a,b)=>b.count-a.count).slice(0,5);
    
    return{mostWinsSeason,mostConsecutiveWins,biggestRaces,mostConsecutiveTitles,biggestTurnouts,mostLeagueTitles:data.achievements?.mostLeagueTitles};
  };
  data.achievements=computeAchievements();
  
  // Dynamically compute club MVPs (GOATs) from race data using value score
  const computeClubMvps=()=>{
    const dc=DIVISIONS[data.division]||DIVISIONS.men;
    const clubAthletes={};

    // Go through all races to compute value scores per club
    data.races.forEach(race=>{
      const raceTeamSize=(dc.historicTeamSize?.(race.season)||dc.teamSize||{a:10,b:10}).a;
      if(!race.results?.length){
        // Handle races without full results (only winner info)
        if(race.winners){
          race.winners.forEach(w=>{
            if(!w.club)return;
            const key=normalizeNameForCompare(w.name);
            if(!clubAthletes[w.club])clubAthletes[w.club]={};
            if(!clubAthletes[w.club][key])clubAthletes[w.club][key]={name:w.name,value:0,aScores:0,races:0};
            clubAthletes[w.club][key].value+=raceTeamSize;
            clubAthletes[w.club][key].aScores++;
            clubAthletes[w.club][key].races++;
          });
        }else if(race.winner&&race.winnerClub){
          const key=normalizeNameForCompare(race.winner);
          if(!clubAthletes[race.winnerClub])clubAthletes[race.winnerClub]={};
          if(!clubAthletes[race.winnerClub][key])clubAthletes[race.winnerClub][key]={name:race.winner,value:0,aScores:0,races:0};
          clubAthletes[race.winnerClub][key].value+=raceTeamSize;
          clubAthletes[race.winnerClub][key].aScores++;
          clubAthletes[race.winnerClub][key].races++;
        }
        return;
      }

      // Group results by club to determine A-team positions
      // For university scoring (b_pts present), only count A-team scorers
      const hasUniversityScoring=race.results.some(r=>r.b_pts!=null);
      const clubResults={};
      race.results.forEach(r=>{
        if(!r.club||r.ns)return;
        if(hasUniversityScoring){
          // Only include A-team scorers (those with pts but not b_pts)
          if(r.pts!=null&&r.b_pts==null){
            if(!clubResults[r.club])clubResults[r.club]=[];
            clubResults[r.club].push(r);
          }
        } else {
          if(!clubResults[r.club])clubResults[r.club]=[];
          clubResults[r.club].push(r);
        }
      });

      // Assign value to each athlete based on their position within their club
      Object.entries(clubResults).forEach(([club,results])=>{
        if(!clubAthletes[club])clubAthletes[club]={};
        results.forEach((r,posInClub)=>{
          const key=normalizeNameForCompare(r.name);
          if(!clubAthletes[club][key])clubAthletes[club][key]={name:r.name,value:0,aScores:0,races:0};
          clubAthletes[club][key].races++;
          if(posInClub<raceTeamSize){
            clubAthletes[club][key].aScores++;
            clubAthletes[club][key].value+=(raceTeamSize-posInClub); // A1=max, A2=max-1, etc.
          }
        });
      });
    });
    
    // Convert to sorted arrays per club
    const mvps={};
    Object.entries(clubAthletes).forEach(([club,athletes])=>{
      const sorted=Object.values(athletes).filter(a=>!isUnknownAthlete(a.name)).sort((a,b)=>b.value-a.value||b.aScores-a.aScores||b.races-a.races);
      mvps[club]=sorted.slice(0,3).map((a,i)=>({...a,mvpRank:i+1}));
    });
    return mvps;
  };
  data.clubMvps=computeClubMvps();
  
  // Compute individual champions with count of titles
  const computeIndividualChampions=()=>{
    const champions={};
    Object.values(data.seasonsData||{}).forEach(sd=>{
      if(sd.individualRankings?.length>0){
        const winner=sd.individualRankings[0];
        if(winner?.name){
          const key=normalizeNameForCompare(winner.name);
          champions[key]=(champions[key]||0)+1;
        }
      }
    });
    return champions;
  };
  data.individualChampions=computeIndividualChampions();
  
  return data;
};

function App(){
  const[view,setViewState]=useState({type:'home'});
  const[division,setDivisionState]=useState('men');
  const[menData,setMenData]=useState(null);
  const[womenData,setWomenData]=useState(null);
  const[cmsContent,setCmsContent]=useState({});
  const[liveAliases,setLiveAliases]=useState({});
  const[loading,setLoading]=useState(true);
  const[error,setError]=useState(null);
  
  // Get current data based on division
  const data=division==='women'?womenData:menData;
  const divisionConfig=DIVISIONS[division];
  
  // Opening a different page (athlete, club, race, list...) starts at the top, not wherever the last page was scrolled to.
  // Switching tabs within the same page (e.g. a race's form guide) keeps the scroll position.
  const viewKey=v=>[v.type,v.athlete?.name,v.club,v.race&&(v.race.season+'-'+v.race.match),v.urlSeason].join('|');
  const setView=(v)=>{if(v?.type==='athlete'&&isUnknownAthlete(v.athlete?.name))return;const moved=viewKey(v)!==viewKey(view);setViewState(v);updateUrl(v,division);if(moved)window.scrollTo(0,0);};
  const setDivision=(d)=>{
    setDivisionState(d);
    // Preserve current view type and context where appropriate
    const preservedTypes = ['home', 'fixtures', 'seasons', 'athletes', 'clubs', 'h2h'];
    let newView;
    if(view.type === 'club' && view.club) {
      // Stay on same club when switching division
      newView = {type: 'club', club: view.club};
    } else if(view.type === 'race' && view.race) {
      // On a race: go to the same season's same fixture in the other division (or that season's page if it has no such race)
      const other = d==='women' ? womenData : menData;
      const key = {season: view.race.season, match: view.race.match};
      if(!other){
        // the other division's results aren't loaded yet: point the address at the race, and the loader picks it up from there
        setViewState({type:'home'});
        window.history.pushState({sl:1},'',(d==='women'?'/women':'')+'/race/'+seasonToCompact(key.season)+'-'+key.match+(view.mode==='guide'?'/form-guide':view.mode==='compare'?'/compare':''));
        window.scrollTo(0,0);
        return;
      }
      const race = other.races.find(r=>r.season===key.season&&r.match===key.match&&r.results?.length);
      newView = race ? {type:'race', race, mode:view.mode} : {type:'home', urlSeason: other.seasons?.includes(key.season) ? key.season : undefined};
    } else if(view.type === 'home' && view.urlSeason) {
      // On a season page: the same season in the other division (the latest if it didn't exist then)
      const other = d==='women' ? womenData : menData;
      newView = {type:'home', urlSeason: !other || other.seasons?.includes(view.urlSeason) ? view.urlSeason : undefined};
    } else if(preservedTypes.includes(view.type)) {
      newView = {type: view.type};
    } else {
      newView = {type: 'home'};
    }
    setViewState(newView);
    updateUrl(newView, d);
    window.scrollTo(0,0);
  };
  
  // Load men's data on mount
  useEffect(()=>{
    // Load aliases first (if configured), then data
    const loadAliases = ALIASES_URL 
      ? fetch(ALIASES_URL).then(r=>r.text()).then(csv=>({...BUILTIN_ALIASES,...parseAliases(csv),...OVERRIDE_ALIASES})).catch(()=>({...BUILTIN_ALIASES,...OVERRIDE_ALIASES}))
      : Promise.resolve({...BUILTIN_ALIASES,...OVERRIDE_ALIASES});
    
    Promise.all([
      fetch('data.json').then(r=>r.json()).then(j=>loadJustIn(j,'men')),
      loadAliases
    ]).then(([j, aliases])=>{
      setLiveAliases(aliases);
      setMenData(normalizeData(j,'men',aliases));
      setLoading(false);
    }).catch(e=>{setError(e.message);setLoading(false);});
    
    // Load CMS content from Google Sheet if URL is configured
    if(CMS_URL){
      fetch(CMS_URL)
        .then(r=>r.text())
        .then(csv=>setCmsContent(parseCmsContent(csv)))
        .catch(e=>console.warn('CMS content load failed:',e));
    }
  },[]);
  
  // Load women's data when switching to women or viewing chartroom (lazy load)
  useEffect(()=>{
    if((division==='women'||view.type==='chartroom')&&!womenData){
      setLoading(true);
      fetch('data-women.json').then(r=>r.json()).then(j=>loadJustIn(j,'women')).then(j=>{
        setWomenData(normalizeData(j,'women',liveAliases));
        setLoading(false);
      }).catch(e=>{setError(e.message);setLoading(false);});
    }
  },[division,womenData,view.type,liveAliases]);
  
  // A "first results" race page swaps itself for the full version once that has been published.
  // The back office says when (a tiny check every 45 seconds); only then is the full data fetched again.
  useEffect(()=>{
    const sets=[['men',menData,setMenData,'data.json'],['women',womenData,setWomenData,'data-women.json']].map(([lg,d,set,file])=>({lg,set,file,waiting:(d?.races||[]).filter(r=>r.justIn&&!r.justIn.demo)})).filter(x=>x.waiting.length);
    if(!sets.length)return;
    const check=()=>fetch(JUSTIN_API,{cache:'no-store'}).then(r=>r.json()).then(l=>{
      const done=new Set((l.races||[]).filter(x=>x.replaced).map(x=>x.key));
      sets.forEach(({lg,set,file,waiting})=>{
        if(!waiting.some(r=>done.has(`${r.season}|${lg}|m${r.match}`)))return;
        fetch(file,{cache:'no-store'}).then(r=>r.json()).then(j=>{
          if(!waiting.every(r=>j.races.some(x=>x.season===r.season&&x.match===r.match)))return; // not on the site quite yet: try again next time
          const nd=normalizeData(j,lg,liveAliases);set(nd);
          if(division===lg)setViewState(v=>v.type==='race'&&v.race?.justIn?{...v,race:nd.races.find(x=>x.season===v.race.season&&x.match===v.race.match)||v.race}:v);
        }).catch(()=>{});
      });
    }).catch(()=>{});
    const id=setInterval(check,45000);
    return()=>clearInterval(id);
  },[menData,womenData,liveAliases,division]);

  // A pre-race page that is open on race day (or the day after) keeps looking for the first results
  // and turns into the results page by itself when they arrive.
  useEffect(()=>{
    const r=view.type==='race'&&view.race?.upcoming?view.race:null;
    if(!r||justInDemo)return;
    const today=justInDay(),from=justInDay(new Date(Date.now()-2*864e5));
    if(!(r.date<=today&&r.date>=from))return;
    const lg=division,file=lg==='women'?'data-women.json':'data.json',set=lg==='women'?setWomenData:setMenData,key=`${r.season}|${lg}|m${r.match}`;
    const check=()=>fetch(JUSTIN_API,{cache:'no-store'}).then(x=>x.json()).then(l=>{
      if(!(l.races||[]).some(x=>x.key===key))return;
      return fetch(file,{cache:'no-store'}).then(x=>x.json()).then(j=>loadJustIn(j,lg)).then(j=>{
        const nd=normalizeData(j,lg,liveAliases),got=nd.races.find(x=>x.season===r.season&&x.match===r.match);
        if(!got)return;
        set(nd);setViewState(v=>v.type==='race'&&v.race?.upcoming&&v.race.season===r.season&&v.race.match===r.match?{...v,race:got}:v);
      });
    }).catch(()=>{});
    const id=setInterval(check,45000);
    return()=>clearInterval(id);
  },[view,division,liveAliases]);

  // Parse URL once data is loaded (needed for athlete name resolution)
  useEffect(()=>{
    if(menData){
      const parsed=parseUrlParams(menData.athletes);
      // Set division from URL
      if(parsed.division&&parsed.division!==division){
        setDivisionState(parsed.division);
      }
      if(parsed.division==='men'||!parsed.division){
        if(parsed.raceKey){
          const race=menData.races.find(r=>r.season===parsed.raceKey.season&&r.match===parsed.raceKey.match)||upcomingRace(menData,parsed.raceKey);
          if(race)setViewState({type:'race',race,mode:parsed.mode});else{const v=raceMissView(parsed,menData);setViewState(v);updateUrl(v,parsed.division||'men');}
        }else{const v=seasonFix(parsed,menData);setViewState(v);if(v!==parsed)updateUrl(v,parsed.division||'men');}
      }
    }
  },[menData]);
  
  // Handle women's URL parsing after women's data loads
  useEffect(()=>{
    if(womenData&&division==='women'){
      const parsed=parseUrlParams(womenData.athletes);
      if(parsed.division==='women'){
        if(parsed.raceKey){
          const race=womenData.races.find(r=>r.season===parsed.raceKey.season&&r.match===parsed.raceKey.match)||upcomingRace(womenData,parsed.raceKey);
          if(race)setViewState({type:'race',race,mode:parsed.mode});else{const v=raceMissView(parsed,womenData);setViewState(v);updateUrl(v,parsed.division||'men');}
        }else{const v=seasonFix(parsed,womenData);setViewState(v);if(v!==parsed)updateUrl(v,parsed.division||'men');}
      }
    }
  },[womenData,division]);
  
  useEffect(()=>{
    const onPop=()=>{
      const parsed=parseUrlParams(data?.athletes);
      if(parsed.division!==division)setDivisionState(parsed.division||'men');
      if(parsed.raceKey&&data){
        const race=data.races.find(r=>r.season===parsed.raceKey.season&&r.match===parsed.raceKey.match)||upcomingRace(data,parsed.raceKey);
        if(race)setViewState({type:'race',race,mode:parsed.mode});else{const v=raceMissView(parsed,data);setViewState(v);updateUrl(v,parsed.division||'men');}
      }else{const v=seasonFix(parsed,data);setViewState(v);if(v!==parsed)updateUrl(v,parsed.division||'men');}
    };
    window.addEventListener('popstate',onPop);
    return()=>window.removeEventListener('popstate',onPop);
  },[data,division]);
  
  useEffect(()=>{
    const onHash=()=>{
      const parsed=parseUrlParams(data?.athletes);
      if(parsed.division!==division)setDivisionState(parsed.division||'men');
      if(parsed.raceKey&&data){
        const race=data.races.find(r=>r.season===parsed.raceKey.season&&r.match===parsed.raceKey.match)||upcomingRace(data,parsed.raceKey);
        if(race)setViewState({type:'race',race,mode:parsed.mode});else{const v=raceMissView(parsed,data);setViewState(v);updateUrl(v,parsed.division||'men');}
      }else{const v=seasonFix(parsed,data);setViewState(v);if(v!==parsed)updateUrl(v,parsed.division||'men');}
    };
    window.addEventListener('hashchange',onHash);
    return()=>window.removeEventListener('hashchange',onHash);
  },[data,division]);
  
  /* page titles for views that don't set their own (athlete and club pages do) */
  useEffect(()=>{if(view.type==='athlete'||view.type==='club'||!data)return;const W=division==='women'?"Women's ":'';let t=null;
    switch(view.type){
      case'home':{const s=view.urlSeason||data.seasons?.[0];t=s?`${W}Division 1 ${s}`:null;break;}
      case'race':{const r=view.race;if(r){const d=r.date&&parseDate(r.date)?formatDate(r.date):`${r.season} match ${r.match}`;t=`${r.venue||'Race'}, ${d}: ${W.toLowerCase()}${view.mode==='guide'?'form guide':'results'}`;}break;}
      case'fixtures':t=`${W}Fixtures`;break;
      case'seasons':t=`${W}Winners`;break;
      case'athletes':t=`${W}Athletes`;break;
      case'clubs':t=`${W}Clubs`;break;
      case'h2h':t='Head to head';break;
      case'chartroom':t='Chart room';break;
      case'origin':t='Origin story';break;
      case'analysis':t='How deep was the field?';break;}
    document.title=t?`${t} | ${DEFAULT_TITLE}`:DEFAULT_TITLE;},[view,division,data]);
  const[blinkExit,setBlinkExit]=useState(true);
  if(loading)return<div className="loading"><Loader/></div>;
  if(error)return<div className="loading text-red-500">Error: {error}</div>;
  if(!data)return<div className="loading"><Loader/></div>;
  
  return<div className="min-h-screen bg-white flex flex-col">
    <LoadedSignal/>
    <a href="#main-content" className="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:shadow-lg focus:rounded">Skip to content</a>
    <Nav setView={setView} division={division} setDivision={setDivision} view={view} champ={reigningChamp(data)}/>
    <main id="main-content" className="flex-1">
      {view.type==='home'&&<HomeView key={view.urlSeason||'default'} setView={setView} data={data} initialSeason={view.urlSeason} division={division} divisionConfig={divisionConfig}/>}
      {view.type==='race'&&<RaceDetailView race={view.race} mode={view.mode} setView={setView} seasonsData={data.seasonsData} clubMvps={data.clubMvps} races={data.races} individualChampions={data.individualChampions} divisionConfig={divisionConfig}/>}
      {view.type==='fixtures'&&<FixturesView setView={setView} races={data.races} seasonsData={data.seasonsData}/>}
      {view.type==='seasons'&&<SeasonsView setView={setView} seasonsData={data.seasonsData} races={data.races} mitchellCupWinners={data.mitchellCupWinners} division={division}/>}
      {view.type==='athletes'&&<AthletesView setView={setView} athletes={data.athletes}/>}
      {view.type==='athlete'&&<AthleteDetailView athlete={view.athlete} setView={setView} athletes={data.athletes} races={data.races} clubMvps={data.clubMvps} seasonsData={data.seasonsData} mitchellCupWinners={data.mitchellCupWinners} divisionConfig={divisionConfig} athleteNee={data.athleteNee} cmsContent={cmsContent} division={division} po10Links={data.po10Links}/>}
      {view.type==='clubs'&&<ClubsView setView={setView} clubAllTime={data.clubAllTime}/>}
      {view.type==='club'&&<ClubDetailView clubCode={view.club} setView={setView} athletes={data.athletes} races={data.races} clubAllTime={data.clubAllTime} clubMvps={data.clubMvps} seasonsData={data.seasonsData} division={division} cmsContent={cmsContent}/>}
      {view.type==='h2h'&&<H2HView athletes={data.athletes} races={data.races} setView={setView} prefill={view.prefill}/>}
      {view.type==='chartroom'&&<ChartRoomView setView={setView} data={data} menData={menData} womenData={womenData}/>}
      {view.type==='origin'&&<OriginStoryView setView={setView} cmsContent={cmsContent} races={data.races}/>}
      {view.type==='analysis'&&<AnalysisView key={view.init?.pin||'a'} setView={setView} init={view.init}/>}
    {IS_APP&&(view.type==='seasons'||view.type==='athletes'||view.type==='clubs')&&<div className="max-w-5xl mx-auto px-4 pb-4"><WreathRule className="mt-6"/><button type="button" className="app-foot" onClick={()=>setView({type:'chartroom'})}>More in the Chart room<PenIcon d={ICON.forward} size={16}/></button></div>}
    </main>
    <Footer setView={setView}/>
  </div>;
}
/* The blinking loader card lives in its own layer (outside App) so it is never swapped out between loading and the peel: no judder at the hand-over */
const BlinkOverlay=()=>{const[exiting,setExiting]=useState(false),[gone,setGone]=useState(false);
  useEffect(()=>{
    /* wait until the page has finished its big first draw and frames are coming smoothly again (3 quick frames in a row, or 900ms at most) before peeling */
    const go=()=>{const start=performance.now();let last=start,calm=0;const wait=now=>{calm=(now-last<24)?calm+1:0;last=now;if(calm>=3||now-start>900){setExiting(true);window.__slPeel=true;window.dispatchEvent(new Event('sl-peel'));}else requestAnimationFrame(wait);};requestAnimationFrame(wait);};
    if(window.__slLoaded)go();window.addEventListener('sl-loaded',go);return()=>window.removeEventListener('sl-loaded',go);},[]);
  /* the card's spot is fixed in pixels when it first appears, so the page's scrollbar (or a phone's address bar) arriving behind it can't nudge it */
  const at=useMemo(()=>({left:Math.round((window.innerWidth-150)/2),top:Math.round((window.innerHeight-150*280/230)/2)}),[]);
  if(gone)return null;
  return<div aria-hidden={exiting?'true':undefined} style={{position:'fixed',inset:0,zIndex:200,pointerEvents:exiting?'none':'auto',background:exiting?'transparent':'#fff'}}><div style={{position:'fixed',left:at.left,top:at.top}}><LoadingBlink exiting={exiting} onDone={()=>setGone(true)}/></div></div>;};
if(LOADER_STYLE!=='carousel'){window.__slWaitPeel=true;const el=document.createElement('div');document.body.appendChild(el);ReactDOM.createRoot(el).render(<BlinkOverlay/>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<!-- Cloudflare Web Analytics (cookieless).
     Owner opt-out: open any page with ?nocount once on a device and that browser stops being counted; ?count turns counting back on.
     The choice is remembered in that browser only (localStorage key "sl-nocount"). -->
<script>
(function(){
  var KEY='sl-nocount',p=new URLSearchParams(location.search),msg=null;
  try{
    if(p.has('nocount')){localStorage.setItem(KEY,'1');msg='Visits from this browser are no longer counted.';}
    else if(p.has('count')){localStorage.removeItem(KEY);msg='Visits from this browser are counted again.';}
  }catch(e){}
  if(msg){
    p.delete('nocount');p.delete('count');var q=p.toString();
    try{history.replaceState(history.state,'',location.pathname+(q?'?'+q:'')+location.hash);}catch(e){}
    var n=document.createElement('div');n.setAttribute('role','status');n.textContent=msg;
    n.style.cssText='position:fixed;left:50%;bottom:'+(document.documentElement.classList.contains('in-app')&&innerWidth<768?88:24)+'px;transform:translateX(-50%);z-index:300;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:#1d211d;color:#fff;font:14px/1.4 system-ui,sans-serif;text-align:center';
    /* shown once the site has finished its first draw, so the loading screen doesn't hide or clear it */
    var show=function(){setTimeout(function(){document.body.appendChild(n);setTimeout(function(){n.remove();},5000);},600);};
    if(window.__slLoaded)show();else window.addEventListener('sl-loaded',show,{once:true});
  }
  var off=false;try{off=localStorage.getItem(KEY)==='1';}catch(e){}
  if(off)return;
  var s=document.createElement('script');s.defer=true;s.src='https://static.cloudflareinsights.com/beacon.min.js';
  s.setAttribute('data-cf-beacon','{"token": "4821b146a9024148905292e993b73a77", "spa": true}');
  document.body.appendChild(s);
})();
</script>
