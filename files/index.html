  <style id="fg-native">

.fg *{box-sizing:border-box}
.fg .wrap{max-width:1040px;margin:0 auto;display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}

.fg .vrow{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:-10px -2px 0;padding:0}

.fg .vrow.more{-webkit-mask-image:linear-gradient(to right,#000 80%,transparent);mask-image:linear-gradient(to right,#000 80%,transparent)}
.fg .vrow .vest{flex:none;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:2px;border:0;border-radius:6px;background:transparent;cursor:pointer;transition:opacity .15s,background .15s}

.fg .vrow .vi{display:block;width:28px;height:28px}.fg .vrow .vi svg{display:block;width:100%;height:100%}
.fg .vrow.one .vest[aria-pressed="false"]{opacity:.3}
.fg .seg{display:inline-flex;align-items:center;gap:0;padding:2px;border-radius:8px;background:var(--seg-bg,#f3f4f2)}
.fg .seg button{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:6px;background:transparent;color:var(--seg-off,#686e66);padding:4px 12px;cursor:pointer;transition:color .15s,background .15s}

<style id="motion">
/* Motion, borrowed from the Lara app's rules (lara/motion-and-ui.md): calm, quick and quiet.
   Things arrive gently, leave a little faster (exits are 80% of entrances), never bounce, and come from what you touched.
   Every timing is a token here; the same numbers are in const MOTION in the app code.
   Leave the athlete portrait posters and the loading sticker alone: they keep their own motion. */
:root{--m-enter:cubic-bezier(.16,1,.3,1);--m-exit:cubic-bezier(.4,0,1,1);--m-move:cubic-bezier(.65,0,.35,1);--m-press:150ms;--m-pop:200ms;--m-pop-out:160ms;--m-fold:300ms;--m-fold-out:240ms;--m-stagger:30ms}
/* Press: buttons give way slightly under the finger (scale 0.97, 150ms). Not inside dialogs, so the poster is untouched. */
:where(button):not(:disabled):not([role="dialog"] *){transition-property:color,background-color,border-color,text-decoration-color,fill,stroke,opacity,box-shadow,scale;transition-duration:var(--m-press);transition-timing-function:var(--m-enter)}
:where(button):not(:disabled):not([role="dialog"] *):active{scale:.97}
/* Popovers and dropdowns: grow out of their trigger from 0.95 with a fade, 200ms in, 160ms out */
@keyframes m-pop-in{from{opacity:0;scale:.95}}
@keyframes m-pop-out{to{opacity:0;scale:.95}}
.m-pop-in{animation:m-pop-in var(--m-pop) var(--m-enter) both}
.m-pop-out{animation:m-pop-out var(--m-pop-out) var(--m-exit) both;pointer-events:none}
/* Rows arriving in an opened accordion: 30ms apart, first 8 only */
@keyframes m-row-in{from{opacity:0;translate:0 -4px}}
@keyframes m-row-out{to{opacity:0}}

// Parse CMS content with simple markdown-like syntax
// *bold* -> <strong>bold</strong>
// [text](url) -> <a href="url">text</a>
// [Name](@athlete:CLUB) -> clickable athlete link
// [Name](@club:CODE) -> clickable club link
// [text](@season:2024/25) -> clickable season link
const ParsedContent=({content,setView})=>{
  if(!content)return null;
  // Handle array input (legacy format) - join into string
  const text=Array.isArray(content)?content.join(' · '):String(content);
  
  // Parse the content into segments
  const parseContent=(input)=>{
    const segments=[];
    let remaining=input;
    
    // Regex patterns
    const patterns=[
      // Internal athlete link: [Name](@athlete:CLUB)
      {regex:/\[([^\]]+)\]\(@athlete:([^)]+)\)/,type:'athlete'},
      // Internal club link: [Name](@club:CODE)
      {regex:/\[([^\]]+)\]\(@club:([^)]+)\)/,type:'club'},
      // Internal season link: [text](@season:YYYY/YY)
      {regex:/\[([^\]]+)\]\(@season:([^)]+)\)/,type:'season'},
      // External link: [text](url)
      {regex:/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/,type:'link'},
      // Bold: *text*
      {regex:/\*([^*]+)\*/,type:'bold'},
    ];
    
    while(remaining.length>0){
      let earliestMatch=null;
      let earliestIndex=remaining.length;
      let matchedPattern=null;
      
      // Find the earliest match among all patterns
      for(const p of patterns){
        const match=remaining.match(p.regex);
        if(match&&match.index<earliestIndex){
          earliestMatch=match;
          earliestIndex=match.index;
          matchedPattern=p;
        }
      }
      
      if(earliestMatch&&matchedPattern){
        // Add text before the match
        if(earliestIndex>0){
          segments.push({type:'text',content:remaining.slice(0,earliestIndex)});
        }
        // Add the matched element
        segments.push({
          type:matchedPattern.type,
          content:earliestMatch[1],
          target:earliestMatch[2]||null,
          full:earliestMatch[0]
        });
        remaining=remaining.slice(earliestIndex+earliestMatch[0].length);
      }else{
        // No more matches, add remaining text
        segments.push({type:'text',content:remaining});
        break;
      }
    }
    return segments;
  };
  
  const segments=parseContent(text);
  
  return<>{segments.map((seg,i)=>{
    switch(seg.type){
      case'text':return<span key={i}>{seg.content}</span>;
      case'bold':return<strong key={i}>{seg.content}</strong>;
      case'link':return<a key={i} href={seg.target} target="_blank" rel="noopener noreferrer" className="text-[#1b649e] hover:underline">{seg.content}</a>;
      case'athlete':return<span key={i} className="text-[#1b649e] underline decoration-[#1b649e]/40 underline-offset-2 hover:decoration-[#1b649e] cursor-pointer whitespace-nowrap" data-ath={seg.content} data-club={seg.target} onClick={()=>setView({type:'athlete',athlete:{name:seg.content,club:seg.target}})}><span className="inline-block align-middle mr-0.5"><ClubShield club={seg.target} size={12}/></span>{seg.content}</span>;
      case'club':return<span key={i} className="text-[#1b649e] underline decoration-[#1b649e]/40 underline-offset-2 hover:decoration-[#1b649e] cursor-pointer whitespace-nowrap" onClick={()=>setView({type:'club',club:seg.target})}><span className="inline-block align-middle mr-0.5"><ClubShield club={seg.target} size={12}/></span>{seg.content}</span>;
      case'season':return<span key={i} className="text-[#1b649e] underline decoration-[#1b649e]/40 underline-offset-2 hover:decoration-[#1b649e] cursor-pointer" onClick={()=>setView({type:'home',urlSeason:seg.target})}>{seg.content}</span>;
      default:return<span key={i}>{seg.content}</span>;
    }
  })}</>;
};

// Parse CSV from Google Sheets into content object
// Structure: type, key, division, content
// division can be: men, women, both (or blank = both)
const parseCmsContent=(csvText)=>{
  const lines=csvText.split('\n');
  const content={};
  
  // Parse CSV (handle quoted fields with commas)
  const parseCSVLine=(line)=>{
    const result=[];
    let current='';
    let inQuotes=false;
    
    for(let j=0;j<line.length;j++){
      const char=line[j];
      if(char==='"'){
        if(inQuotes&&line[j+1]==='"'){
          current+='"';
          j++;
        }else{
          inQuotes=!inQuotes;
        }
      }else if(char===','&&!inQuotes){
        result.push(current);
        current='';
      }else{
        current+=char;
      }
    }
    result.push(current);
    return result;
  };
  
  // Skip header row, parse remaining
  for(let i=1;i<lines.length;i++){
    const line=lines[i];
    if(!line.trim())continue;
    
    const fields=parseCSVLine(line);
    const[type,key,division,value]=fields;
    
    if(type&&key){
      if(!content[type])content[type]={};
      // Store with division info: {men: '...', women: '...', both: '...'}
      if(!content[type][key])content[type][key]={};
      const div=(division||'both').toLowerCase().trim();
      content[type][key][div]=value||'';
    }
  }
  
  return content;
};

// Parse aliases CSV: from_name,to_name
const parseAliases=(csvText)=>{
  const lines=csvText.split('\n');
  const aliases={};
  
  // Skip header row
  // Format: Canonical, Alias1, Alias2, Alias3, ...
  for(let i=1;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line)continue;
    
    // Parse CSV properly (handle potential quoted fields)
    const parts=line.split(',').map(p=>p.trim().replace(/^"|"$/g,''));
    if(parts.length<2)continue;
    
    const canonical=parts[0];
    if(!canonical)continue;
    
    // All subsequent columns are aliases
    for(let j=1;j<parts.length;j++){
      const alias=parts[j];
      if(alias){
        // Store lowercase key for matching
        aliases[alias.toLowerCase()]=canonical;
      }
    }
  }
  
  return aliases;
};

  return entry[division]||entry['both']||entry['']||null;
};

const LOADER_STYLE=(()=>{try{return new URLSearchParams(location.search).get('loader');}catch(e){return null;}})();
const Loader=()=>LOADER_STYLE==='carousel'?<LoadingVests/>:null;  // blinking card is the default; ?loader=carousel shows the portrait carousel
const LoadingVests=()=>{
  // Loading carousel: a random line-up of athlete portraits gliding sideways, biggest in the centre.
  // No club appears twice within any four consecutive faces (including across the loop join).
  const N=14,GAP=4;
  const picks=useMemo(()=>{const clubOf={};Object.values(PORTRAITS).forEach(v=>{if(!clubOf[v.file])clubOf[v.file]=v.club;});
    const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
    const men=PORTRAIT_MEN.split(',').filter(f=>clubOf[f]),women=PORTRAIT_WOMEN.split(',').filter(f=>clubOf[f]);
    // always open on a vintage face: Bob Holt or Bernie Ford in the centre, Lionel Mann two along
    const fixed={0:Math.random()<.5?'bob-holt':'bernie-ford',2:'lionel-mann'};Object.keys(fixed).forEach(k=>{if(!clubOf[fixed[k]])delete fixed[k];});
    const fixedFiles=Object.values(fixed);
    // favourites: striking-looking runners who turn up far more often (weighted shuffle)
    const FAVOURITES=LOADER_FAVOURITES;
    const wshuffle=a=>a.map(f=>[Math.random()**(1/(FAVOURITES.includes(f)?40:1)),f]).sort((x,y)=>y[0]-x[0]).map(x=>x[1]);
    for(let tries=0;tries<60;tries++){const pools=[wshuffle(men.filter(f=>!fixedFiles.includes(f))),wshuffle(women.filter(f=>!fixedFiles.includes(f)))],out=[];
      for(let k=0;k<N;k++){if(fixed[k]){out.push(fixed[k]);continue;}const pool=pools[k%2];  // man, woman, man, woman...
        const ahead=[];for(let j=1;j<GAP;j++)if(fixed[k+j])ahead.push(fixed[k+j]);
        const near=out.slice(Math.max(0,k-GAP+1)).concat(k>=N-GAP+1?out.slice(0,k-(N-GAP)):[]).concat(ahead).map(f=>clubOf[f]);
        const i=pool.findIndex(f=>!near.includes(clubOf[f]));if(i<0)break;out.push(pool.splice(i,1)[0]);}
      if(out.length===N)return out;}
    return shuffle(men.concat(women)).slice(0,N);},[]);
  const[urls,setUrls]=useState({});
  useEffect(()=>{let dead=false;picks.forEach((f,j)=>loadBust(`/portraits/athletes/${f}.svg?v=${PORTRAIT_V}`).then(u=>{if(!dead)setUrls(m=>({...m,[j]:u}));}).catch(()=>{}));return()=>{dead=true;};},[picks]);
  const refs=useRef([]);
  const SP=40,BIG=61;
  useEffect(()=>{let raf;const t0=performance.now();
    // steady drift with a gentle surge: speed swings between ~0.35x and ~1.65x but never stops
    const V=1/340,W=2*Math.PI/340,A=0.55;
    const tick=now=>{const t=now-t0,pos=V*t-(A*V/W)*Math.sin(W*t);
      refs.current.forEach((el,j)=>{if(!el)return;let d=((j-pos)%N+N)%N;if(d>N/2)d-=N;const a=Math.abs(d);
        if(a>2.8){el.style.opacity=0;return;}
        const sc=1-0.62*Math.min(a/2.5,1)**1.3,op=a<1.8?1:Math.max(0,1-(a-1.8)/0.95);
        el.style.opacity=op;el.style.zIndex=100-Math.round(a*10);el.style.transform=`translate3d(${d*SP*(1+0.06*Math.min(a,2))}px,0,0) scale(${sc})`;});
      raf=requestAnimationFrame(tick);};
    raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);},[]);
  return<div aria-label="Loading" role="status" style={{position:'relative',width:Math.min(240,typeof window!=='undefined'?window.innerWidth-32:240),height:BIG*1.22,overflow:'hidden',WebkitMaskImage:'linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)',maskImage:'linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)'}}>
    {picks.map((f,j)=>urls[j]&&<div key={j} ref={el=>refs.current[j]=el} style={{position:'absolute',left:'50%',bottom:0,width:BIG,height:BIG*1.22,marginLeft:-BIG/2,overflow:'hidden',transformOrigin:'50% 100%',opacity:0,willChange:'transform,opacity'}}><img src={urls[j]} alt="" style={{display:'block',width:BIG,maxWidth:'none',height:'auto'}}/></div>)}
  </div>;
};

const DEFAULT_OG_IMAGE='https://s.microlink.io/https://slarchive.org';

// Hook to manage document metadata (title, favicon, og tags)
const useDocumentMeta=({title,favicon,ogImage,ogDesc})=>{
  useEffect(()=>{
    // Store original values on first run
    if(!window._originalMeta){
      window._originalMeta={
        title:document.title,
        favicon:document.querySelector('link[rel="icon"]')?.href,
        ogTitle:document.querySelector('meta[property="og:title"]')?.content,
        ogImage:document.querySelector('meta[property="og:image"]')?.content,
        ogDesc:document.querySelector('meta[property="og:description"]')?.content
      };
    }
    
    // Update title
    document.title=title||DEFAULT_TITLE;
    
    // Update favicon
    const faviconEl=document.querySelector('link[rel="icon"]');
    if(faviconEl){
      faviconEl.href=favicon||DEFAULT_FAVICON;
    }
    
    // Update OG tags
    const ogTitleEl=document.querySelector('meta[property="og:title"]');
    const ogImageEl=document.querySelector('meta[property="og:image"]');
    const ogDescEl=document.querySelector('meta[property="og:description"]');
    if(ogTitleEl)ogTitleEl.content=title||DEFAULT_TITLE;
    if(ogImageEl)ogImageEl.content=ogImage||DEFAULT_OG_IMAGE;
    if(ogDescEl)ogDescEl.content=ogDesc||DEFAULT_OG_DESC;
    
    // Cleanup: restore defaults when unmounting
    return()=>{
      document.title=DEFAULT_TITLE;
      if(faviconEl)faviconEl.href=DEFAULT_FAVICON;
      if(ogTitleEl)ogTitleEl.content=DEFAULT_TITLE;
      if(ogImageEl)ogImageEl.content=DEFAULT_OG_IMAGE;
      if(ogDescEl)ogDescEl.content=DEFAULT_OG_DESC;
    };
  },[title,favicon,ogImage,ogDesc]);
};

/* Desktop only: hovering an athlete's name (any element tagged data-ath/data-club) shows their bust just to the right of the name, if they have a drawn portrait (generic silhouettes are skipped) */
(()=>{let mq;try{mq=window.matchMedia('(hover: hover) and (pointer: fine)');}catch(e){return;}
  let box=null,img=null,cur=null,timer=null;
  const W=64,H=Math.round(W*148/126);
  const make=()=>{box=document.createElement('div');box.setAttribute('aria-hidden','true');box.setAttribute('data-hover-bust','');
    box.style.cssText=`position:fixed;z-index:150;width:${W}px;height:${H}px;border-radius:4px;overflow:hidden;pointer-events:none;opacity:0;transform:translateX(-4px);transition:opacity .12s ease-out,transform .12s ease-out;box-shadow:0 1px 3px rgba(0,0,0,.12)`;
    img=document.createElement('img');img.alt='';img.style.cssText=`display:block;width:${W}px;height:${Math.round(W*1.4)}px`;box.appendChild(img);document.body.appendChild(box);};
  const fileFor=(name,club)=>{if(!name)return null;let f=club?portraitFile(name,club):null;if(!f&&!club){const a=PORTRAITS[normalizeNameForCompare(name).replace(/\s*\([^)]*\)$/,'')];if(a)f=a.file;}return f;};
  /* the visible name inside a tagged row or cell, so the bust sits beside the words rather than the far end of the row */
  const nameEl=(el,name)=>{const want=(name||'').trim().toLowerCase().split(' (')[0];let best=el;if(!want)return el;
    el.querySelectorAll('*').forEach(c=>{const t=(c.textContent||'').trim().toLowerCase();if(t.startsWith(want)&&c.getClientRects().length&&best.contains(c))best=c;});return best;};
  const hide=()=>{clearTimeout(timer);cur=null;if(box){box.style.opacity='0';box.style.transform='translateX(-4px)';}};
  const show=(el)=>{const name=el.getAttribute('data-ath'),club=el.getAttribute('data-club')||'';const f=fileFor(name,club);if(!f)return;
    const row=el.closest('tr')||el;if([...row.querySelectorAll('img')].some(i=>{const u=i.getAttribute('src')||'';return u.startsWith('blob:')||u.includes('/portraits/athletes/');}))return;  /* portrait already showing in this row */
    if(!box)make();const src=`/portraits/athletes/${f}.svg?v=${PORTRAIT_V}`;if(img.getAttribute('src')!==src)img.setAttribute('src',src);
    const r=nameEl(el,name).getBoundingClientRect();let x=r.right+20,y=r.top+r.height/2-H/2;
    if(x+W>window.innerWidth-8)x=Math.max(8,r.left-W-20);y=Math.min(Math.max(8,y),window.innerHeight-H-8);
    box.style.left=x+'px';box.style.top=y+'px';box.style.opacity='1';box.style.transform='none';};
  document.addEventListener('mouseover',e=>{if(!mq.matches)return;const el=e.target.closest&&e.target.closest('[data-ath]');if(el===cur)return;hide();if(!el)return;cur=el;timer=setTimeout(()=>{if(cur===el)show(el);},120);},true);
  document.documentElement.addEventListener('mouseleave',hide);window.addEventListener('scroll',hide,{passive:true});window.addEventListener('blur',hide);document.addEventListener('click',hide,true);})();
const fitClubNames=()=>{if(window.innerWidth>=768)return;document.querySelectorAll('table').forEach(t=>{if(!t.querySelector('.cn-full'))return;const box=t.parentElement;
  t.setAttribute('data-cn','full');const fits=t.offsetWidth<=box.clientWidth+1;if(!fits)t.setAttribute('data-cn','code');});};
(()=>{let q=0;const run=()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;fitClubNames();});};
  const start=()=>{new MutationObserver(run).observe(document.body,{childList:true,subtree:true,characterData:true});window.addEventListener('resize',run);try{document.fonts.ready.then(run);}catch(e){}run();};
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);})();

// Left/right arrow keys and horizontal swipes step to the previous/next item (seasons on the tables page, fixtures on a race page)
const usePrevNextNav=(onPrev,onNext)=>{const ref=React.useRef({});ref.current={onPrev,onNext};
  React.useEffect(()=>{
    const typing=el=>el&&(el.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
    const onKey=e=>{if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||typing(document.activeElement))return;
      if(e.key==='ArrowLeft'&&ref.current.onPrev){e.preventDefault();ref.current.onPrev();}else if(e.key==='ArrowRight'&&ref.current.onNext){e.preventDefault();ref.current.onNext();}};
    // Ignore swipes that start in a sideways-scrolling table, or at the screen edge (the browser's own back gesture)
    const scrollsX=el=>{for(;el&&el!==document.body;el=el.parentElement){const o=getComputedStyle(el).overflowX;if((o==='auto'||o==='scroll')&&el.scrollWidth>el.clientWidth+2)return true;}return false;};
    let t=null;
    const onStart=e=>{if(e.touches.length!==1){t=null;return;}const p=e.touches[0];if(p.clientX<30||p.clientX>window.innerWidth-30||scrollsX(e.target)||typing(e.target)){t=null;return;}t={x:p.clientX,y:p.clientY,at:Date.now()};};
    const onEnd=e=>{if(!t)return;const p=e.changedTouches[0],dx=p.clientX-t.x,dy=p.clientY-t.y,dt=Date.now()-t.at;t=null;
      if(dt>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2)return;
      if(dx<0&&ref.current.onNext)ref.current.onNext();else if(dx>0&&ref.current.onPrev)ref.current.onPrev();};
    window.addEventListener('keydown',onKey);window.addEventListener('touchstart',onStart,{passive:true});window.addEventListener('touchend',onEnd,{passive:true});
    return()=>{window.removeEventListener('keydown',onKey);window.removeEventListener('touchstart',onStart);window.removeEventListener('touchend',onEnd);};
  },[]);};
const SeasonSelector=({season,setSeason,seasons})=>{
  const[showDropdown,setShowDropdown]=useState(false);
  const idx=seasons.indexOf(season);
  const dropdownRef=React.useRef(null);
  
  React.useEffect(()=>{
    const handleClick=(e)=>{if(dropdownRef.current&&!dropdownRef.current.contains(e.target))setShowDropdown(false);};
    document.addEventListener('mousedown',handleClick);
    return()=>document.removeEventListener('mousedown',handleClick);
  },[]);
  
  usePrevNextNav(idx<seasons.length-1?()=>setSeason(seasons[idx+1]):null,idx>0?()=>setSeason(seasons[idx-1]):null);

// Shared team-score computation used by both full and compact team tables
const computeTeamScores=(results,startPos,count,divisionConfig,race)=>{
  const clubScores={};
  const isATeam = startPos === 1;
  const excludedClubs = new Set(Object.entries(CLUBS).filter(([k,v])=>v.hidden).map(([k])=>k));
  const aTeamClubs = new Set();
  results.forEach(r=>{if(r.pts != null && !excludedClubs.has(r.club)) aTeamClubs.add(r.club);});
  results.forEach(r=>{
    if(excludedClubs.has(r.club)) return;
    const hasPts = isATeam ? (r.pts != null) : (r.b_pts != null);
    const pts = isATeam ? r.pts : r.b_pts;
    if(hasPts) {
      if(!clubScores[r.club]) clubScores[r.club] = [];
      if(clubScores[r.club].length < count) clubScores[r.club].push(pts);
    }
  });
  if(!isATeam) { aTeamClubs.forEach(club => { if(!clubScores[club]) clubScores[club] = []; }); }
  let penalty;
  if(race?.penalties) {
    penalty = isATeam ? race.penalties.a : race.penalties.b;
  } else if(divisionConfig?.penaltyFormula === 'scoringFinishers+10') {
    const scoringFinishers = race?.scoringFinishers || results.filter(r => !r.ns).length;
    penalty = scoringFinishers + 10;
  } else {
    const totalScorers = Object.values(clubScores).reduce((sum, scores) => sum + scores.length, 0);
    const totalMissing = Object.values(clubScores).reduce((sum, scores) => sum + Math.max(0, count - scores.length), 0);
    const missingPositions = Array.from({length: totalMissing}, (_, i) => totalScorers + 1 + i);
    penalty = totalMissing > 0 ? missingPositions.reduce((a,b) => a+b, 0) / totalMissing : 0;
  }
  return Object.entries(clubScores).map(([club,scores])=>{
    const missing = count - scores.length;
    const penalties = missing > 0 ? Array(missing).fill(penalty) : [];
    const allScores = [...scores, ...penalties];
    const lastScorer = scores.length > 0 ? scores[scores.length - 1] : Infinity;
    return {club, points: allScores.reduce((a,b)=>a+b,0), scores, penalties, penaltyScore: penalty, complete: scores.length >= count, lastScorer};
  }).filter(t=>t.scores.length>0||t.penalties.length>0).sort((a,b)=>{
    if(a.points !== b.points) return a.points - b.points;
    return a.lastScorer - b.lastScorer;
  }).map((t,i)=>({...t,pos:i+1}));
};

-1.5">{team.scores.map((s,i)=><span key={i} className="text-xs text-gray-500 tabular-nums border border-gray-200 px-1 rounded">{s}</span>)}{team.penalties.map((p,i)=><span key={`p${i}`} className="text-xs text-red-600 tabular-nums border border-red-200 px-1 rounded" title="Penalty score">*</span>)}{!team.complete&&team.penalties.length===0&&<span className="text-xs text-gray-300 ml-1">incomplete</span>}</div></td></tr>)}</tbody></table>{penaltyValue&&<p className="text-xs text-gray-500 mt-2">* Penalty = {Number.isInteger(penaltyValue)?penaltyValue:penaltyValue.toFixed(1)} pts</p>}</div>;

// thumbPos / widePos: where each photo is cropped from. The first number is how far across to centre the crop; the second is the
// main subject's eyeline, measured down the whole photo (eyes a fifth of the way down = 20%). EyeImg then places that eyeline a
// third of the way down the crop, whatever the crop's shape, so faces sit in the top third and are never cut off.
const EyeImg=({pos,style,onLoad,...rest})=>{
  const ref=useRef(null);const [op,setOp]=useState(pos);
  const place=()=>{const im=ref.current;if(!im||!im.naturalWidth||!im.clientWidth||!im.clientHeight)return;
    const [x,y]=String(pos||'50% 30%').split(' ');const e=parseFloat(y)/100;
    const v=im.clientHeight/(im.naturalHeight*Math.max(im.clientWidth/im.naturalWidth,im.clientHeight/im.naturalHeight)); // share of the photo's height the crop shows
    const py=v>=.999?50:Math.max(0,Math.min(100,(e-v/3)/(1-v)*100));setOp(`${x} ${py.toFixed(1)}%`);};
  useEffect(()=>{place();const im=ref.current;if(!im||!window.ResizeObserver)return;const ro=new ResizeObserver(place);ro.observe(im);return()=>ro.disconnect();},[pos,rest.src]);
  return<img ref={ref} onLoad={e=>{place();onLoad&&onLoad(e);}} {...rest} style={{...(style||{}),objectPosition:op}}/>;
};

    {src:'photos/races/1991-92-m2-mather.jpg',thumbPos:'50% 17%',widePos:'50% 17%',caption:'Belgrave\u2019s John Mather (left) with South London\u2019s Jerry Twomey (356) on Wimbledon Common. Mather finished 157th and Twomey 165th.',credit:"Photo: Ray O'Donoghue",links:{'Jerry Twomey':'John Twomey'}},{src:'photos/races/1991-92-m2-montage.jpg',thumbPos:'50% 12%',widePos:'50% 12%',caption:'A montage from Wimbledon Common, labelled by the photographer. Top row: South London\u2019s Ray Marriott and Hercules Wimbledon\u2019s S Ingall; South London\u2019s Paul Williams and F Upcott; Belgrave\u2019s John Mather with Jerry Twomey. Bottom row: Hercules Wimbledon\u2019s John Owen and Tony Austin; and Aldershot, Farnham & District\u2019s Roger Hackney with Belgrave\u2019s Frank Ward, who finished seventh and eighth.',credit:"Photos: Ray O'Donoghue",links:{'S Ingall':'S Ingall','F Upcott':'W Upcott','John Owen':'J Owen','Tony Austin':'T Austin','Jerry Twomey':'John Twomey'}},{src:'photos/races/1991-92-m2-boxhill-trio.jpg',thumbPos:'50% 9%',widePos:'50% 9%',caption:'Three panels from Wimbledon Common: Boxhill Racers\u2019 Tim Crossman in the first, Hercules Wimbledon\u2019s Peter Clarke (156) in the middle and Boxhill\u2019s Barry Attwell (111) on the right. Crossman finished 15th, Clarke 19th and Attwell 25th.',credit:"Photos: Ray O'Donoghue",links:{'Barry Attwell':'Barry Attwell','Peter Clarke':'Peter Clarke'}},{src:'photos/races/1991-92-m2-best.jpg',thumbPos:'50% 10%',widePos:'50% 10%',caption:'Some of the best on the day at Wimbledon Common, in perhaps one of the strongest Surrey League fields ever. Left to right: Hercules Wimbledon\u2019s Simon Rayner (175), Steve Harris (82), Boxhill Racers\u2019 Ken Penney (110), Aldershot, Farnham & District\u2019s Roger Hackney (17) with Belgrave\u2019s Frank Ward behind, and Belgrave\u2019s Stuart Paton (77). Rayner was third, Penney fourth, Harris fifth as a guest, Hackney seventh, Ward eighth and Paton 16th, behind winner Gary Staines.',credit:"Photos: Ray O'Donoghue",notPictured:['Gary Staines']},{src:'photos/races/firth-major-1991.jpg',thumbPos:'85% 21%',widePos:'85% 21%',caption:'More panels from Wimbledon Common. The third repeats Roger Hackney (17) and Frank Ward from the montage above; the last, its print mirror-image and now flipped back, shows South London\u2019s Stuart Major (left), who finished 30th, with clubmate Robin Firth (384). Firth is not in that day\u2019s results.',credit:"Photos: Ray O'Donoghue",links:{'Robin Firth':'Robin Firth'}},{src:'photos/races/1991-92-m2-montage91.jpg',thumbPos:'50% 31%',widePos:'50% 31%',caption:'\u201cSurrey League 91\u201d: just some of the best in action on Wimbledon Common, in a race won by Belgrave\u2019s Gary Staines from Hercules Wimbledon\u2019s Dave Clarke. Labelled by the photographer: Simon Rayner (175), Steve Harris (82), Ken Penney (110), Stuart Paton (77), and Roger Hackney (17) and Thames Hare & Hounds\u2019 Andy Thomas (421), who finished seventh and tenth. A sport where ordinary club runners line up with top internationals.',credit:"Photos: Ray O'Donoghue",notPictured:['Gary Staines','Dave Clarke']}],
  '1991/92|3':[{src:'photos/races/1991-92-m3-nower.jpg',thumbPos:'50% 27%',widePos:'50% 27%',seasonBest:1,caption:'Stuart Paton (71) and his brother Andy Paton (72) in the charge up the first hill at The Nower, Dorking, with Stuart Major on the far left.',credit:"Photo: Ray O'Donoghue",...belg(218,'May 1992',36)}],
  '1991/92|4':[{src:'photos/races/1991-92-m4-boxhill.jpg',thumbPos:'50% 19%',widePos:'50% 19%',caption:'A strong group at Coulsdon with Boxhill Racers\u2019 Ken Penney and Kevin Howard (138 and 148), Hercules Wimbledon\u2019s Pete Clarke and Kevin Jacques, and Thames Hare & Hounds\u2019 Andy Thomas. Clarke finished sixth, Howard seventh, Thomas eighth and Penney 13th.',credit:"Photo: Ray O'Donoghue",links:{'Pete Clarke':'Peter Clarke','Kevin Howard':'K Howard','Kevin Jacques':'Kevin Jacques'}},{src:'photos/races/1991-92-m4-collage.jpg',thumbPos:'50% 24%',widePos:'50% 24%',caption:'Coulsdon. Top, left to right: Ollie Foote, second Belgrave home; Frank Ward; Marco Mazzotta. Bottom: Jon Hobbs, Andy Paton and Don Anderson.',links:{'Jon Hobbs':'Jonathon Hobbs'},credit:'Photographer not named',...belg(218,'May 1992',38)},

    {src:'photos/races/1991-92-m4-dickinson.jpg',thumbPos:'50% 10%',widePos:'50% 10%',caption:'Belgrave\u2019s Charlie Dickinson (72) at Coulsdon, where he finished 71st. He would go on to manage the Belgrave women\u2019s team through the most successful period in their history.',credit:'Photographer not named',...belg(218,'May 1992',28)},{src:'photos/races/1991-92-m4-ford-hill.jpg',thumbPos:'50% 16%',widePos:'50% 16%',caption:'Aldershot, Farnham & District\u2019s Bernie Ford (14), winner of 13 Division One races between 1971 and 1988, with Thames Hare & Hounds\u2019 Dave Hill on the left. The photographer remembered it as the mid-1980s, but this is the only Coulsdon fixture in our results with both men: Hill finished 14th and Ford 38th.',credit:"Photo: Ray O'Donoghue",links:{'Bernie Ford':'Bernie Ford'}}],
  '1992/93|1':[{src:'photos/races/1992-93-m1-brockwell.jpg',thumbPos:'50% 49%',widePos:'50% 49%',caption:'The field streams across Brockwell Park, labelled with Hounslow\u2019s S Thomas on the left, Hercules Wimbledon\u2019s Pete Clarke (271) in the centre and Hounslow\u2019s Terry Booth out on the right. Clarke finished 32nd, Booth 50th and Thomas 88th.',credit:"Photo: Ray O'Donoghue",links:{'Pete Clarke':'Peter Clarke','S Thomas':'S Thomas'}}],

  '1998/99|1':[{src:'photos/races/1998-99-m1-quinn-foley.jpg',thumbPos:'50% 20%',widePos:'50% 20%',seasonBest:1,caption:"Kevin Quinn (57) and Ray Foley (68) race down the Brockwell Park slopes ahead of Thames Hare & Hounds' Dave Hill.",credit:'Photo: Alan Mead',...belg(227,'March 1999',47)},

  '2005/06|1':[{src:'photos/races/2005-06-m1-brockwell.jpg',thumbPos:'50% 21%',widePos:'50% 21%',caption:'Phil Wicks (9) and Stephen Sharp (1) share the lead, with South London’s Jermaine Mays tucked in behind. John McFarlane and Phil Tedd, both of Thames Hare & Hounds, made up the leading group. Mays went on to win.',credit:'Photo: Steve Wicks',...bhw('20051210054337','www.belgraveharriers.com/photo_gallery/surrey_lg_2005-6_1/surrey_lg_2005-6_1.html')},{src:'photos/races/2005-06-m1-leaders.jpg',thumbPos:'40% 52%',widePos:'40% 52%',caption:'A very top field down the slope at Brockwell Park: Belgrave\u2019s Stephen Sharp (1) and Thames Hare & Hounds\u2019 Phil Tedd (310) lead from Belgrave\u2019s Phil Wicks, with South London\u2019s Jermaine Mays (263) and Stuart Major (276), Thames\u2019 John McFarlane (301) and Herne Hill\u2019s Dave Taylor, mostly hidden, behind. They were the first seven home: Mays won from Sharp, Wicks, McFarlane, Tedd, Taylor and Major.',credit:"Photo: Ray O'Donoghue",links:{'John McFarlane':'John McFarlane','Phil Tedd':'Phillip Tedd'}}],

  '2006/07|1':[{src:'photos/races/2006-07-m1-team.jpg',thumbPos:'50% 16%',widePos:'50% 16%',caption:'The Belgrave team at Brockwell Park, where they finished second as Herne Hill dominated on their home turf.',credit:'Photographer not named',...bhw('20081011025619','www.belgraveharriers.com/2006/rc_2006_a.htm')},{src:'photos/races/2006-07-m1-weir.jpg',thumbPos:'50% 53%',widePos:'50% 53%',caption:'Thames Hare & Hounds\u2019 Andy Weir (352) leads a group down the slope at Brockwell Park, with Ranelagh\u2019s Duncan Bell and Mark Middleton and Stragglers\u2019 Roy Reeder (450) among those following. Weir finished 18th, Bell 32nd, Reeder 35th and Middleton 58th.',credit:"Photo: Ray O'Donoghue",links:{'Duncan Bell':'Duncan Bell'}}],
  '2006/07|4':[{src:'photos/races/2006-07-m4-weir.jpg',thumbPos:'50% 12%',widePos:'50% 12%',caption:'The ever-popular and consistent Andy Weir (358) of Thames Hare & Hounds splashes through Richmond Park, with Ranelagh\u2019s Dave Benton (205) behind. Benton got the better of him by three seconds at the finish, 12th to Weir\u2019s 13th.',credit:"Photo: Ray O'Donoghue"},{src:'photos/races/2006-07-m4-attwell.jpg',thumbPos:'50% 14%',widePos:'50% 14%',caption:'Longtime adversaries South London\u2019s Barry Attwell (319) and Herne Hill\u2019s Tony Harran (179) ignore the puddles and charge straight through in Richmond Park. Harran got the better of it, 42nd to Attwell\u2019s 53rd.',credit:"Photo: Ray O'Donoghue"}],

  '2008/09|3':[{src:'photos/races/2008-09-m3-major.jpg',thumbPos:'50% 14%',widePos:'50% 14%',caption:'The leading three on a snow-covered Farthing Downs: Thames Hare & Hounds\u2019 James McMullan (361) ahead of clubmate Stuart Major (356), with Herne Hill\u2019s Benedict Whitby (162) behind. Whitby went on to win, from Major and McMullan.',credit:"Photo: Ray O'Donoghue"},{src:'photos/races/2008-09-m3-frost.jpg',thumbPos:'40% 18%',widePos:'40% 18%',caption:'Hoar frost on Farthing Downs: Thames Hare & Hounds\u2019 James McMullan (361) and Stuart Major (356) lead, with Herne Hill\u2019s Benedict Whitby close behind and his clubmate Ben Paviour among the chasing group. Whitby went on to win, from Major and McMullan, with Paviour sixth.',credit:"Photo: Ray O'Donoghue"}],
  '2009/10|1':[{src:'photos/races/2009-10-m1-start.jpg',thumbPos:'50% 19%',widePos:'50% 19%',caption:'Paskar Owor, John Kimaiyo and Will Cockerell form an early spearhead of the Belgrave team at Reigate Priory Park, with Thames Hare & Hounds\u2019 James McMullan (411), who finished fourth, among them.',credit:'Photo: Alan Mead',...bhw('20110812081620','belgraveharriers.com/2009/rc_2009.htm')}],

  '2025/26|4':[{src:'photos/races/2025-26-m4-trophy.jpg',thumbPos:'50% 34%',widePos:'50% 34%',caption:'Belgrave team manager Steve Gardner lifts the league trophy after Belgrave completed a clean sweep of all four fixtures, their first men\u2019s title since 2002. Celebrating with him: Sam Sommerville (10), Matt Edgar (23), Josh Mitchell (in the cap) and, right of frame in glasses, Sam Gebreselassie.',people:['Steve Gardner'],links:{'Matt Edgar':'Matthew Edgar','Sam Gebreselassie':'Samuel Gebreselassie'},credit:'Photo: George Parker',source:"George Parker's gallery",href:'https://georgeparker.pixieset.com/surreyleaguexcwimbledon/'},

  '2022/23|1':[{src:'photos/races/2022-23-m1-start.jpg',thumbPos:'60% 38%',widePos:'60% 38%',caption:'The start on Effingham Common. Left to right: Hercules Wimbledon\u2019s Fred Slemeck (501), Belgrave\u2019s Dave Bowers (65), Charlie Eastaugh of Hercules Wimbledon in the red cap, South London\u2019s Gary Laybourne (875) and James Lyne (877), Belgrave\u2019s Ian Crowe-Wright (67) with Croydon\u2019s James Hancock behind him, and Guildford & Godalming\u2019s James Harvey (361), Andy Coley-Maud (339) and, far right, Johnny Van Deventer. Coley-Maud won from Crowe-Wright, with Laybourne fourth and Slemeck sixth.',credit:'Photo: Surrey League',links:{'Dave Bowers':'David Bowers','Johnny Van Deventer':'Johnny Van Deventer'}}],

  'w|2008/09|3':[{src:'photos/races/2008-09-w3-snow.jpg',thumbPos:'60% 17%',widePos:'60% 17%',caption:'South London\u2019s Pippa Major leads a group across a snowbound Coulsdon, with Reigate Priory\u2019s Meera Siva and Major\u2019s clubmate Nicky Morgan also in the pack. Siva finished 25th, Major 27th and Morgan 37th.',credit:"Photo: Ray O'Donoghue"},{src:'photos/races/2008-09-w3-frost.jpg',thumbPos:'50% 19%',widePos:'50% 19%',caption:'A frozen Farthing Downs, with South London\u2019s Pippa Major (445) and a clubmate (450) ahead of a Belgrave runner (8) and an Epsom & Ewell runner (971). Major finished 27th.',credit:"Photo: Ray O'Donoghue"}],

  'w|2013/14|1':[{src:'photos/races/2013-14-w1-start.jpg',thumbPos:'50% 17%',widePos:'50% 17%',caption:'Surrey League royalty on the start line at Lightwater, plus two young supporters. Among them, Thames Hare & Hounds\u2019 Julia Bleasdale, who won the race, and her clubmate Dorchie Cockerell (573). Reigate Priory\u2019s Fiona Clark (462) had won the season opener four years running, 2008 to 2011, and finished fourth here. Herne Hill\u2019s Cathy Ansell (428) was third, and would take her first win at the next match.',credit:'Photo: Surrey League',source:'Surrey League on Facebook'}],

  'w|2014/15|3':[{src:'photos/races/2014-15-w3-wilkins-ansell.jpg',thumbPos:'50% 11%',widePos:'50% 11%',caption:'Belgrave\u2019s Mel Wilkins (1020) and Herne Hill\u2019s Cathy Ansell duel on Wimbledon Common. Ansell won by 14 seconds.',credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/womens-surrey-league-race-3-wimbledon-common-10-january-2015'}],
  'w|2014/15|4':[{src:'photos/races/2014-15-w4-field.jpg',thumbPos:'50% 60%',widePos:'50% 60%',caption:'The women\u2019s field strung out across Farthing Down, Coulsdon.',credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/women-surrey-league-match-4-coulsdon-7-february-2015'}],
  'w|2015/16|3':[{src:'photos/races/2015-16-w3-start.jpg',thumbPos:'50% 21%',widePos:'50% 21%',caption:'On the start line at Reigate Priory, with Belgrave\u2019s Zoe Vail Smith, Mel Wilkins and Sally Underhill near the front. Vail Smith finished sixth and Wilkins tenth.',links:{'Zoe Vail Smith':'Zoe Vail Smith'},credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/womens-surrey-league-div-1-race-3-reigate-16-jan-2016'}],
  'w|2016/17|1':[{src:'photos/races/2016-17-w1-vailsmith-haileselase.jpg',thumbPos:'50% 28%',widePos:'50% 28%',caption:'Belgrave\u2019s Saron Haileselase (1024) and Zoe Vail Smith at the front of the start line at Nonsuch Park. Vail Smith finished eighth and Haileselase 13th.',links:{'Zoe Vail Smith':'Zoe Vail Smith'},credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/womens-surrey-league-div-1-nonsuch-park-15-oct-2016'},{src:'photos/races/2016-17-w1-grima.jpg',thumbPos:'50% 39%',widePos:'50% 39%',caption:'Hercules Wimbledon\u2019s Claire Grima (1400) knows Dulwich\u2019s Clare Elms (1208) is going to be at her all day long at Nonsuch Park, but Grima held on to sixth by a single second. Behind them, Guildford & Godalming\u2019s Sam Ludlow Taylor (2384) enjoys a fine run, while out in front Woking\u2019s Jo Wilkinson (2885), who ran at the 2010 European Championships, finished ahead of them both. Ludlow Taylor and Wilkinson were running in the Division Two race alongside.',credit:'Photo: Chris de Mauny',links:{'Sam Ludlow Taylor':'Sam Ludlow Taylor'}}],
  'w|2017/18|1':[{src:'photos/races/2017-18-w1-start.jpg',thumbPos:'50% 40%',widePos:'50% 40%',caption:'The mass start at Reigate Priory. Belgrave\u2019s Sophie Harris worked her way up from here to win by 27 seconds.',credit:'Photo: Bill Laws',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/surrey-ladies-cross-country-league-div-1-match-1-reigate-priory-14-oct-2017'}],
  'w|2016/17|2':[{src:'photos/races/2016-17-w2-brown.jpg',thumbPos:'50% 52%',widePos:'50% 52%',caption:'One of the most sensational runs in Surrey League history. Herne Hill\u2019s Alex Brown (1469), aged just 15, let the leaders go on the first lap before reeling them in, here leading South London\u2019s Steph McCall (1725) with Ranelagh\u2019s Gillian Sanders (1589) in third. They finished in that order, Brown winning by a single second. A former UK under-13 1500m number one, she had won the junior English Schools cross country title aged 11.',credit:'Photo: Surrey League',source:'Surrey League on Facebook'},{src:'photos/races/2016-17-w2-start.jpg',thumbPos:'60% 38%',widePos:'60% 38%',caption:'The women\u2019s field sets off on Mitcham Common, with South London\u2019s Steph McCall (1725) to the fore. She would finish second, a single second behind the winner.',credit:'Photo: Chris de Mauny'}],
  'w|2016/17|4':[{src:'photos/races/2016-17-w4-brinsden.jpg',thumbPos:'50% 22%',widePos:'50% 22%',caption:'Epsom & Ewell\u2019s Izzy Brinsden (1282), alone and lost in thought, ploughs on through the snow at Coulsdon on her way to her first Surrey League win, more than a minute clear of Amy Clements.',credit:'Photo: Chris de Mauny',links:{'Izzy Brinsden':'Isabel Brinsden'},notPictured:['Amy Clements']}],
  'w|2017/18|2':[{src:'photos/races/2017-18-w2-harris.jpg',thumbPos:'40% 45%',widePos:'40% 45%',caption:'Belgrave\u2019s Sophie Harris (15) leads at Nonsuch Park, chased by Clapham Chasers\u2019 Stephanie Davis, who would go on to run the marathon for Great Britain at the Paris Olympics, with Katy Hedgethorne and Isabel Brinsden close behind. They finished in that order, Harris winning by eight seconds.',credit:'Photo: Chris de Mauny'}],
  'w|2017/18|4':[{src:'photos/races/2017-18-w4-harris.jpg',thumbPos:'50% 29%',widePos:'50% 29%',caption:'Belgrave\u2019s Sophie Harris (15) sets out at Richmond Park on her way to the only grand slam in Surrey League history, winning all four matches in a season. With her: Saron Haileselase, Carla Molinaro, Katy Hedgethorne, Georgie Grgec, Sophie Hoare and Isabel Brinsden, with Clare Elms in the background.',credit:'Photo: Surrey League',source:'Surrey League on Facebook',href:'https://www.facebook.com/photo.php?fbid=1599451440102506&set=t.789119809&type=3'}],

  'w|2026/27|2':[{src:'photos/races/2026-27-w2-leaders.jpg',thumbPos:'50% 47%',widePos:'50% 47%',caption:'Herne Hill\u2019s Molly Smith (328) and Lucy Jones (312) out in front at Beckenham Place Park. Jones finished {pos:Lucy Jones|first} and Smith {pos:Molly Smith|second}.',bibs:{328:'Molly Smith',312:'Lucy Jones'},credit:'Photo: George Parker',source:"George Parker's gallery",href:'https://georgeparker.pixieset.com/surreyleague2627beckenham/?pid=20986062039&id=8&h=MTU3OTYzOTk4NQ'},{src:'photos/races/2026-27-w2-carter.jpg',thumbPos:'50% 45%',widePos:'50% 45%',caption:'Ruby Carter (300), in her first race for Herne Hill after moving from Hercules Wimbledon, leads clubmate Sophie Tooley and Belgrave\u2019s Juliet Hodder (25). They finished {pos:Ruby Carter|third}, {pos:Sophie Tooley|fourth} and {pos:Juliet Hodder|sixth}.',bibs:{300:'Ruby Carter',332:'Sophie Tooley',25:'Juliet Hodder'},credit:'Photo: George Parker',source:"George Parker's gallery",href:'https://georgeparker.pixieset.com/surreyleague2627beckenham/?pid=20986065184&id=34&h=Njg4ODI5ODY2'},{src:'photos/races/2026-27-w2-robinson.jpg',thumbPos:'50% 43%',widePos:'50% 43%',caption:'Belgrave\u2019s Katrina Robinson (56) in her first Surrey League race. She finished {pos:Katrina Robinson|14th}.',bibs:{56:'Katrina Robinson'},credit:'Photo: George Parker',source:"George Parker's gallery",href:'https://georgeparker.pixieset.com/surreyleague2627beckenham/?pid=20986073534&id=136&h=Mjc0OTI2ODQ3OQ'},{src:'photos/races/2026-27-w2-pack.jpg',thumbPos:'50% 48%',widePos:'50% 48%',caption:'Thames Hare & Hounds\u2019 Florence Wiggins (691), Herne Hill\u2019s Olivia Stillman (329) and Guildford & Godalming\u2019s Evie Warren (210) in a pack at Beckenham Place Park. Warren finished {pos:Evie Warren|tenth}, Wiggins {pos:Florence Wiggins|11th} and Stillman {pos:Olivia Stillman|20th}.',bibs:{691:'Florence Wiggins',329:'Olivia Stillman',210:'Evie Warren'},credit:'Photo: George Parker',source:"George Parker's gallery",href:'https://   '2010/11|4':[{src:'photos/races/2010-11-m4-start.jpg',thumbPos:'50% 37%',widePos:'50% 37%',caption:'Early on at Wimbledon Common, with Thames Hare & Hounds\u2019 James McMullan (859) on the left, Belgrave\u2019s Will Cockerell over his shoulder, Thames\u2019 Ben Reynolds (868) in the middle and Belgrave\u2019s Paskar Owor (38) on the right. McMullan won by 25 seconds from Owor, with Reynolds seventh and Cockerell tenth.',credit:"Photo: Ray O'Donoghue"}],
  '2013/14|2':[{src:'photos/races/2013-14-m2-tickner.jpg',thumbPos:'30% 14%',widePos:'30% 14%',caption:'Gazing across at the master on the start line at Mitcham Common. Kent AC\u2019s Frank Tickner (111), twice National cross country champion and recently turned 30, went on to win, with clubmate John Gilbert second. Also on the line: Andy Coley-Maud, who finished fourth, Thames Hare & Hounds\u2019 James McMullan, seventh, and Hercules Wimbledon\u2019s Fred Slemeck and Jonathan Cornish.',credit:'Photo: Surrey League',source:'Surrey League on Facebook'}],
  '2014/15|2':[{src:'photos/races/2014-15-m2-owor.jpg',thumbPos:'50% 23%',widePos:'50% 23%',caption:'Thames Hare & Hounds\u2019 James Hoad (940) has a rush of blood to the head early on at Lloyd Park, leading Kent AC\u2019s John Gilbert (151) and Belgrave\u2019s Paskar Owor (11) with the field strung out behind. Owor went on to win, the ninth of his twelve Division One wins; Gilbert was fourth and Hoad 24th.',credit:'Photo: Bill Laws',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/mens-2xu-surrey-cross-country-league-match-2-lloyd-park-8-nov-2014'}],
  '2014/15|3':[{src:'photos/races/2014-15-m3-owor.jpg',thumbPos:'50% 11%',widePos:'50% 11%',caption:'Belgrave\u2019s Paskar Owor (30), incognito in a cap, among the leaders on Streatham Common, with South London\u2019s Kevin Quinn to his left and Kent AC\u2019s Chris Greenwood (3) ahead. Owor won by 13 seconds from Greenwood; Quinn was sixth.',credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/mens-2xu-surrey-cross-country-league-match-3-streatham-common-10-jan-2015'},{src:'photos/races/2014-15-m3-start.jpg',thumbPos:'50% 11%',widePos:'50% 11%',caption:'The start on Streatham Common, with Kent AC\u2019s Chris Greenwood, John Gilbert and Owen Hind, South London\u2019s Kevin Quinn and Belgrave\u2019s Matt Welsh among the front runners. Greenwood finished second, Quinn sixth, Hind seventh, Gilbert 13th and Welsh 29th.',credit:"Photo: Ray O'Donoghue"}],
  '2014/15|4':[{src:'photos/races/2014-15-m4-owor.jpg',thumbPos:'50% 42%',widePos:'50% 42%',caption:'Belgrave\u2019s Paskar Owor clear of Kent AC\u2019s John Gilbert at Richmond Park. Owor won by 17 seconds from Gilbert, completing a hat-trick of wins that season.',credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/mens-surrey-league-match-4-petersham-7-feb-2015'},
    {src:'photos/races/2014-15-m4-ward.jpg',thumbPos:'50% 9%',widePos:'50% 9%',caption:'Belgrave\u2019s Frank Ward (44) at Richmond Park, 30 years after his first Surrey League race in 1984.',credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/mens-surrey-league-match-4-petersham-7-feb-2015'},{src:'photos/races/2014-15-m4-hegvold.jpg',thumbPos:'40% 9%',widePos:'40% 9%',caption:'Reigate Priory\u2019s Steve Bass, Kent AC\u2019s Stu Beaney (116), Herne Hill\u2019s Dave Robinson (504) and Ranelagh\u2019s Ted Mockett (718) try to keep up with Belgrave\u2019s Knut Hegvold (46), once a 13:42 5,000m man, in Richmond Park. Robinson, who first scored for Herne Hill in October 1993, was their seventh scorer here and taught Hegvold a lesson in pacing, finishing 61st, 1:45 ahead of him.',credit:'Photo: Surrey League',source:'Surrey League on Facebook',links:{'Stu Beaney':'Stuart Beaney'}}],
  '2015/16|4':[{src:'photos/races/2015-16-m4-start.jpg',thumbPos:'50% 34%',widePos:'50% 34%',caption:'Early in the race on Wimbledon Common, with Kent AC\u2019s Alex Yee, on his way to victory, and Neil Phillips, Belgrave\u2019s Paskar Owor, Hercules Wimbledon\u2019s Fred Slemeck, South London\u2019s Pat Canavan and Herne Hill\u2019s Mike Cummings, who did not finish.',credit:'Photo: Surrey League',source:'Surrey League on Facebook',links:{'Mike Cummings':'Mike Cummings'}}],
  '2018/19|3':[{src:'photos/races/2018-19-m3-parkinson.jpg',thumbPos:'60% 26%',widePos:'60% 26%',caption:'A sensational Surrey League debut from Thames Hare & Hounds\u2019 Jamie Parkinson (834), chaperoned here in the early stages by Kent AC\u2019s Owen Hind (422) and Max Nicholls. An outstanding third lap took him clear, and he won by 22 seconds from Nicholls, with Hind fourth. He has made only one league appearance since, finishing 73rd at Richmond Park in October 2021.',credit:'Photo: Chris de Mauny',source:'Surrey League on Facebook'}],
  '2018/19|4':[{src:'photos/races/2018-19-m4-champagne.jpg',thumbPos:'50% 30%',widePos:'50% 30%',caption:'Finn Johnson pops the champagne at Lloyd Park as Hercules Wimbledon celebrate the league title, their first since 1964/65, after winning all four matches of the season.',credit:'Photo: Surrey League',source:'Surrey League on Facebook'}],
  '2019/20|1':[{src:'photos/races/2019-20-m1-pack.jpg',thumbPos:'50% 37%',widePos:'50% 37%',caption:'A wet morning on Effingham Common. Kent AC\u2019s Jordan Weaver (660) and Belgrave\u2019s Andrius Jaksevicius (81) were heading for 12th and 14th, and Hercules Wimbledon\u2019s Finn Johnson (455) would hang on for 18th. Around them: Guildford & Godalming\u2019s Simon Goldsworthy (321), Dulwich\u2019s Ed Chuck behind Johnson, Herne Hill\u2019s Lewis Laylee (534) with Matt Richards of Hercules Wimbledon behind him, and Mike Cummings further back.',credit:'Photo: Surrey League',source:'Surrey League on Facebook',links:{'Ed Chuck':'Edward Chuck','Matt Richards':'Matthew Richards'}}],
  '2015/16|1':[{src:'photos/races/2015-16-m1-start.jpg',thumbPos:'50% 40%',widePos:'50% 40%',caption:'The opening match of the season gets under way on Wimbledon Common, with Paskar Owor wearing number 1 after winning three of the four matches the previous winter. Also in the front rank: Owen Hind, Chris Greenwood, John Gilbert, Andy Coley-Maud, Pat Canavan, Will Cockerell, Mike Cummings, Andrius Jaksevicius, Robert Norville and Herne Hill\u2019s Chris Busaileh.',credit:'Photo: Surrey League',source:'Surrey League on Facebook',links:{'Chris Busaileh':'Chris Busaileh'}}],
  '2015/16|2':[{src:'photos/races/2015-16-m2-start.jpg',thumbPos:'50% 46%',widePos:'50% 46%',caption:'A huge men\u2019s field gets away on Wimbledon Common.',credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/mens-surrey-league-2-div-1-wimbledon-common-7-nov-2015'}],
  '2017/18|1':[{src:'photos/races/2017-18-m1-podium.jpg',thumbPos:'50% 25%',widePos:'50% 25%',caption:'The first three at Reigate Priory: (l-r) Clapham Chasers\u2019 Andy Coley-Maud (2nd), Belgrave\u2019s Nick Goolab (winner) and Paskar Owor (3rd).',credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/mens-surrey-cross-country-league-div-1-match-1-reigate-priory-14-oct-2017'},{src:'photos/races/2017-18-m1-start.jpg',thumbPos:'60% 46%',widePos:'60% 46%',caption:'Thames Hare & Hounds\u2019 James McMullan and Kent AC\u2019s Dame Dibaba lay down the gauntlet to nearly 200 runners early in the season opener at Reigate Priory, with John Gilbert and Andy Coley-Maud in close attendance. McMullan held on for 8th and Dibaba 13th.',credit:'Photo: Sophie Harris',source:'Surrey League on Facebook'}],
  '2017/18|2':[{src:'photos/races/2017-18-m2-start.jpg',thumbPos:'50% 36%',widePos:'50% 36%',caption:'Away from the start on Mitcham Common: Belgrave\u2019s Andrew Connick ahead of Thames Hare & Hounds\u2019 Jim Allchin (white vest, foreground), with South London\u2019s Ryan Evans behind him, and in the pack Hercules Wimbledon\u2019s Fred Slemeck, Belgrave\u2019s Andrius Jaksevicius, Nick Goolab and Ed Auden, Kent AC\u2019s Neil Phillips and South London\u2019s Joe Croft. Goolab went on to win.',links:{'Ed Auden':'Edward Auden'},credit:'Photo: Belgrave Harriers',source:'Belgrave Harriers news',href:'https://www.belgraveharriers.com/news/mens-surrey-cross-country-league-div-1-race-2-mitcham-common-11-nov-2017'},{src:'photos/races/2017-18-m2-goolab.jpg',thumbPos:'50% 21%',widePos:'50% 21%',caption:'Belgrave\u2019s Nick Goolab (21) bides his time behind Clapham Chasers\u2019 Andy Coley-Maud (100) on Mitcham Common, with Josh Grace (823), Herne Hill\u2019s Lewis Lloyd and Belgrave\u2019s Paskar Owor (33) following. None of them finished where pictured: Goolab won, Lloyd was second, Coley-Maud third and Owor fourth, while Grace did not finish.',credit:'Photo: Andy Walker',links:{'Andy Coley-Maud':'Andy Coley-Maud'}}],
  '2017/18|4':[{src:'photos/races/2017-18-m4-start.jpg',thumbPos:'50% 21%',widePos:'50% 21%',caption:'Early on at Wimbledon Common. Left to right: Hercules Wimbledon\u2019s Dimos Evangelidis (248), Clapham Chasers\u2019 James Ellison (107), Hercules Wimbledon\u2019s Ross Matheson (275), Kent AC\u2019s John Gilbert (440) and Ben Harding (455), Thames Hare & Hounds\u2019 James McMullan (778), and Hercules Wimbledon\u2019s Andrew Penney (260) and Matthew Sharp (267). Gilbert went on to finish second and Matheson fourth.',credit:"Photo: Ray O'Donoghue",links:{'James McMullan':'James McMullan'}},{src:'photos/races/2017-18-m4-top4.jpg',thumbPos:'40% 10%',widePos:'50% 10%',caption:'The first four on Wimbledon Common, left to right in finishing order: Clapham Chasers\u2019 Andy Coley-Maud (100), Kent AC\u2019s John Gilbert, carrying his number in his hand, Herne Hill\u2019s Lewis Lloyd (379) and Hercules Wimbledon\u2019s Ross Matheson.',credit:"Photos: Ray O'Donoghue"},{src:'photos/races/2017-18-m4-hw-montage.jpg',thumbPos:'50% 43%',widePos:'50% 43%',caption:'A selection of Hercules Wimbledon runners on a wet afternoon. Top row, left to right: David Grima, Fred Slemeck (third), David Lewin (256, fourth) and Andrew Penney (far right). Bottom row: the legendary Dave Clarke (243), still turning out as an over-60, Richard McDowell, Ben Toomer (269), Jonny Earl (247) and Joe Toomey (270). Hercules Wimbledon were second on the day behind Kent AC.',links:{'Richard McDowell':'Richard Mcdowell'},credit:"Photos: Ray O'Donoghue"},{src:'photos/races/2017-18-m4-montage2.jpg',thumbPos:'50% 31%',widePos:'50% 31%',caption:'More from Wimbledon Common. Top row: Belgrave\u2019s Arne Dumez (62) with a South London runner; Thames Hare & Hounds\u2019 Oliver Brodrick-Ward (742) and Herne Hill\u2019s Liam O\u2019Flaherty (342), who finished 177th and 176th. Bottom row: Herne Hill\u2019s Chris Busaileh (356) and South London\u2019s Mark Finbow (816); Thames Hare & Hounds\u2019 David Symons (785) and Kent AC\u2019s Andy Moreton, 128th and 127th; Ranelagh\u2019s Richard Gregory (511); and South London\u2019s Kevin Quinn (856) with Ranelagh\u2019s Ben Anderson (548).',credit:"Photos: Ray O'Donoghue",links:{"Liam O\u2019Flaherty":"Liam O'Flaherty"}}],
  '2018/19|1':[{src:'photos/races/2018-19-m1-sesemann.jpg',thumbPos:'50% 32%',widePos:'50% 32%',caption:'Kent AC\u2019s Phil Sesemann (425) holds off Belgrave\u2019s Nick Goolab (15) at Richmond Park to win by five seconds.',credit:'Photo: Steve Gardner'},{src:'photos/races/2018-19-m1-dumez.jpg',thumbPos:'50% 34%',widePos:'50% 34%',caption:'Belgrave\u2019s Arne Dumez on an autumn afternoon in Richmond Park, on his way to 63rd.',credit:'Photo: Steve Gardner'},{src:'photos/races/2018-19-m1-sanderson.jpg',thumbPos:'40% 36%',widePos:'40% 36%',caption:'Guildford & Godalming\u2019s John Sanderson (101) ahead of Belgrave\u2019s Paskar Owor (1), chased by Kent AC\u2019s Tom Mower, Owen Hind and Max Nicholls. They finished in that order, 3rd to 7th, behind Phil Sesemann and Nick Goolab.',credit:'Photo: Steve Gardner',notPictured:['Phil Sesemann','Nick Goolab']},{src:'photos/races/2018-19-m1-walker.jpg',thumbPos:'50% 28%',widePos:'50% 28%',caption:'A walker in Richmond Park is unfussed by the passing pack of internationals: (l-r) Belgrave\u2019s Paskar Owor, Kent AC\u2019s Max Nicholls (418), Phil Sesemann, Belgrave\u2019s Nick Goolab, Ranelagh\u2019s Anthony Haynes (516) and Hercules Wimbledon\u2019s Howell Craske (213). Sesemann won from Goolab; Owor was fourth, Nicholls seventh, Craske eighth and Haynes ninth.',credit:'Photo: Nigel Bramley'}],
  '2018/19|2':[{src:'photos/races/2018-19-m2-yee.jpg',thumbPos:'50% 24%',widePos:'50% 24%',seasonBest:1,caption:'Kent AC\u2019s Alex Yee, the future Olympic triathlon champion, leads the early dash through the puddles on a waterlogged Wimbledon Common. He went on to win by 35 seconds.',credit:'Photo: Steve Gardner'}],
  '2021/22|1':[{src:'photos/races/2021-22-m1-evans.jpg',thumbPos:'50% 44%',widePos:'50% 44%',caption:'Belgrave\u2019s Dylan Evans (59) leads down the hill at Richmond Park from Alex Brecker (65) and Guildford & Godalming\u2019s John Sanderson (264), with Kent\u2019s Max Nicholls (520) next. They finished in the order Evans, Sanderson, Brecker, Evans winning on his Surrey League debut.',credit:'Photo: Steve Gardner'},
    {src:'photos/races/2021-22-m1-ruddy.jpg',thumbPos:'50% 26%',widePos:'50% 26%',seasonBest:1,caption:'Further back, Belgrave\u2019s Craig Ruddy (44) runs alongside Thames Hare & Hounds\u2019 Rich Ollington (817). Ruddy finished 26th and Ollington 34th.',links:{'Rich Ollington':'Richard Ollington'},credit:'Photo: Steve Gardner'},
    {src:'photos/races/2021-22-m1-brecker.jpg',thumbPos:'50% 28%',widePos:'50% 28%',caption:'Belgrave\u2019s Alex Brecker (65) at Richmond Park on his only Surrey League appearance, finishing third. It was a promising debut before injury cut his career short.',credit:'Photo: Steve Gardner'}],

/* Filtering a race's results to one club (tap a singlet), and back: the other clubs' runners roll away, then the chosen club's runners close up
   into place; clearing it, they glide back to their places while everyone else fades back in. Timings from claude/motion.md. Reduce Motion: instant. */
const useClubFilterMotion=(tbodyRef,clubFilter,setClubFilter)=>{
  const first=useRef(null);
  const still=()=>!Element.prototype.animate||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const visible=()=>{const tb=tbodyRef.current;if(!tb)return[];const vh=window.innerHeight;return[...tb.rows].filter(r=>{const b=r.getBoundingClientRect();return b.height>0&&b.bottom>-100&&b.top<vh+100;});};
  const snap=()=>{const m=new Map();visible().forEach(r=>m.set(r.dataset.k,r.getBoundingClientRect().top));return m;};
  const change=club=>{
    if(club===clubFilter)return;
    if(still()){setClubFilter(club);return;}
    if(club){
      const rows=visible(),leaving=rows.filter(r=>r.dataset.c!==club);first.current={tops:snap(),mode:'in'};
      leaving.forEach((r,i)=>r.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX(-24px)'}],{duration:160,delay:Math.min(i*6,90),easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}));
      setTimeout(()=>setClubFilter(club),leaving.length?200:0);
    }else{first.current={tops:snap(),mode:'out'};setClubFilter(null);}
  };
  useLayoutEffect(()=>{const f=first.current;first.current=null;if(!f)return;const tb=tbodyRef.current;if(!tb)return;
    [...tb.rows].forEach(r=>r.getAnimations().forEach(a=>a.cancel()));
    const vh=window.innerHeight;let n=0;
    visible().forEach(r=>{const was=f.tops.get(r.dataset.k),now=r.getBoundingClientRect().top;
      if(was==null){if(f.mode==='out'){r.animate([{opacity:0},{opacity:1}],{duration:200,delay:Math.min(n++*12,180),easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'});}return;}
      const d=Math.max(-vh,Math.min(vh,was-now));if(Math.abs(d)<.5)return;
      r.animate([{transform:`translateY(${d}px)`,backgroundColor:'#fff',position:'relative',zIndex:1},{transform:'none',backgroundColor:'#fff',position:'relative',zIndex:1}],{duration:300,easing:'cubic-bezier(.65,0,.35,1)'});});
  },[clubFilter]);
  return change;
};

/* Compare tab on a race page: this race against another (by default the previous match of the same season).
   For each runner who ran both, splits the change in finishing place into three parts that add up exactly:
   newcomers who finished ahead this time, runners who beat them last time but didn't run this time,
   and the change in rank among the runners who ran both (the part down to how they ran). */
const raceShortWhen=x=>{const MON=['Oct','Nov','Jan','Feb'];const y=parseInt(x.season)+(x.match>=3?1:0);return `${MON[(x.match||1)-1]||''} ${y}`.trim();};
/* Compare tab chart: place here (across) against place in the other race (up). Runners who missed one race sit in a faded "didn't run" strip at the end of that race's axis and play no part in the trend line. Move or drag across to read what a place here is worth in the other race. */
const CompareScatter=({data,thisName,otherName,hl})=>{
  const[hx,setHx]=useState(null);const svgRef=useRef(null);const boxRef=useRef(null);const[W,setW]=useState(640);

  const tr=[...trend.entries()].sort((a,b)=>a[0]-b[0]);
  const path=tr.map(([x,y],i)=>`${i?'L':'M'}${X(x).toFixed(1)},${Y(y).toFixed(1)}`).join('');
  const move=e=>{const r=svgRef.current.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const vx=cx/r.width*W;const p=Math.round(1+(vx-L)/(W-L-R)*(dA-1));setHx(p>=1&&p<=maxA?p:null);};

      onPointerMove={move} onPointerDown={move} onPointerLeave={()=>setHx(null)}>
      {/* grid and axes */}
      {tA.map(v=><g key={'xa'+v}><line x1={X(v)} x2={X(v)} y1={T} y2={H-B} stroke="#eef0f2"/><text x={X(v)} y={H-B+14} fontSize="11" textAnchor="middle" fill="#6b7280">{v}</text></g>)}
      {tB.map(v=><g key={'ya'+v}><line x1={L} x2={W-R} y1={Y(v)} y2={Y(v)} stroke="#eef0f2"/><text x={L-6} y={Y(v)+4} fontSize="11" textAnchor="end" fill="#6b7280">{v}</text></g>)}
      <rect x={X(maxA+gA/2)} y={T} width={W-R-X(maxA+gA/2)} height={H-B-T} fill="#f3f4f6"/>

      {onlyB.map((r,i)=><circle key={'b'+i} cx={X(dA)} cy={Y(r.p)} r="2.2" fill="#9ca3af" opacity=".45"/>)}
      {rows.map(r=><circle key={r.k} cx={X(r.pA)} cy={Y(r.pB)} r="2.4" fill={dot} opacity=".38"/>)}
      <path d={path} fill="none" stroke="#111827" strokeWidth="2.2" strokeLinejoin="round"/>
      {/* the searched or opened runner */}
      {hl&&<g data-static><line x1={X(hl.pA)} x2={X(hl.pA)} y1={Y(hl.pB)} y2={H-B} stroke={chartLineColor(hl.club)} strokeDasharray="3,3"/><line x1={L} x2={X(hl.pA)} y1={Y(hl.pB)} y2={Y(hl.pB)} stroke={chartLineColor(hl.club)} strokeDasharray="3,3"/>
        <circle cx={X(hl.pA)} cy={Y(hl.pB)} r="5.5" fill={chartLineColor(hl.club)} stroke="#fff" strokeWidth="2"/>
        <text x={X(hl.pA)+(X(hl.pA)>W*0.7?-9:9)} y={Y(hl.pB)-8} fontSize="12" fontWeight="600" textAnchor={X(hl.pA)>W*0.7?'end':'start'} fill="#111827" stroke="#fff" strokeWidth="3" paintOrder="stroke">{hl.name}</text></g>}
      {/* read across */}
      {readX!=null&&<g data-static pointerEvents="none"><line x1={X(readX)} x2={X(readX)} y1={H-B} y2={Y(readY)} stroke="#111827" strokeWidth="1"/><line x1={L} x2={X(readX)} y1={Y(readY)} y2={Y(readY)} stroke="#111827" strokeWidth="1"/><circle cx={X(readX)} cy={Y(readY)} r="3.5" fill="#111827"/></g>}
    </svg>
    <p className="text-sm text-gray-700 min-h-[1.5rem]">{readX!=null?<><b className="font-semibold text-gray-900">{ordPos(readX)}</b> at {thisName} ≈ <b className="font-semibold text-gray-900">{ordPos(Math.round(readY))}</b> at {otherName}, on the trend line.</>:<span className="text-gray-500">Move across the chart to read what a place here was worth at {otherName}. Grey dots ran only one of the two races.</span>}</p>
  </div>;
};
const RaceCompare=({race,races,setView})=>{
  const others=useMemo(()=>(races||[]).filter(x=>x!==race&&x.season===race.season&&(x.results||[]).length>0).sort((a,b)=>a.match-b.match),[races,race]);
  const defaultOther=others.filter(x=>x.match<race.match).slice(-1)[0]||others[0]||null;
  const[other,setOther]=useState(defaultOther);const[q,setQ]=useState('');const[open,setOpen]=useState(null);const[sort,setSort]=useState('pos');
  useEffect(()=>{setOther(defaultOther);setOpen(null);},[race]);
  const data=useMemo(()=>{
    if(!other)return null;
    const index=res=>{const m=new Map(),dup=new Set();(res||[]).forEach(r=>{const p=parseInt(r.pos);if(!p)return;const k=normalizeNameForCompare(r.name);if(m.has(k))dup.add(k);else m.set(k,{...r,p});});dup.forEach(k=>m.delete(k));return m;};
    const A=index(race.results),B=index(other.results);
    const sortedA=[...A.values()].sort((a,b)=>a.p-b.p),sortedB=[...B.values()].sort((a,b)=>a.p-b.p);
    const both=new Set([...A.keys()].filter(k=>B.has(k)));

    const rA=rankIn(sortedA),rB=rankIn(sortedB);
    /* running counts of finishers ahead who didn't run the other race */
    const rows=[...both].map(k=>{const a=A.get(k),b=B.get(k),cA=rA.get(k),cB=rB.get(k);return{k,name:a.name,club:a.club,pA:a.p,pB:b.p,cA,cB,newAhead:a.p-1-(cA-1),goneAhead:b.p-1-(cB-1)};});

    const onlyB=sortedB.filter(r=>!both.has(normalizeNameForCompare(r.name))).map(r=>({name:r.name,club:r.club,p:r.p}));
    const maxA=Math.max(0,...(race.results||[]).map(r=>parseInt(r.pos)||0)),maxB=Math.max(0,...(other.results||[]).map(r=>parseInt(r.pos)||0));
    /* trend: a running median of the other race's place around each place here, then forced to rise steadily (pool-adjacent-violators) so it reads across cleanly */
    const pts=rows.map(r=>[r.pA,r.pB]).sort((x,y)=>x[0]-y[0]);const h=Math.max(4,Math.round(maxA*0.06));const raw=[];let lo=0,hi=0;
    for(let x=1;x<=maxA;x++){while(lo<pts.length&&pts[lo][0]<x-h)lo++;while(hi<pts.length&&pts[hi][0]<=x+h)hi++;const ys=pts.slice(lo,hi).map(q=>q[1]).sort((u,v)=>u-v);if(ys.length>=3)raw.push([x,ys.length%2?ys[(ys.length-1)/2]:(ys[ys.length/2-1]+ys[ys.length/2])/2]);}
    const blocks=[];raw.forEach(([x,y])=>{blocks.push({xs:[x],sum:y,n:1});while(blocks.length>1&&blocks[blocks.length-2].sum/blocks[blocks.length-2].n>blocks[blocks.length-1].sum/blocks[blocks.length-1].n){const t=blocks.pop(),u=blocks[blocks.length-1];u.xs.push(...t.xs);u.sum+=t.sum;u.n+=t.n;}});
    const step=[];blocks.forEach(bk=>bk.xs.forEach(x=>step.push([x,bk.sum/bk.n])));

    const trend=new Map();const sw=Math.max(2,Math.round(h/2));step.forEach(([x],i)=>{let t=0,n=0;for(let j=Math.max(0,i-sw);j<=Math.min(step.length-1,i+sw);j++){t+=step[j][1];n++;}trend.set(x,t/n);});
    return{rows,nBoth:both.size,nA:A.size,nB:B.size,onlyA,onlyB,maxA,maxB,trend};
  },[race,other]);
  if(!others.length)return<p className="text-sm text-gray-500 py-4">There's no other race this season to compare with yet.</p>;
  const thisName=race.venue,otherName=other?.venue||'';
  const sq=searchFold(q);
  let rows=data?.rows||[];
  const qNum=/^\s*\d+\s*(st|nd|rd|th)?\s*$/i.test(q)?parseInt(q):null;
  if(qNum)rows=rows.filter(r=>r.pA===qNum);else if(sq)rows=rows.filter(r=>nameSearchScore(r.name,q)||searchFold(r.club).includes(sq));
  rows=[...rows].sort(sort==='gain'?((a,b)=>(a.cA-a.cB)-(b.cA-b.cB)||a.pA-b.pA):((a,b)=>a.pA-b.pA));
  const shown=rows.slice(0,sq?100:400);
  const autoOpen=sq&&rows.length===1?rows[0].k:null;

  if(first<0)return null;
  /* the dotted line marks the bottom of Division 1 each season (league size); seasons outside Division 1 get a dot a place below it */
  const span=seasons.slice(first,last+1).map(s=>{const size=seasonsData[s].standings.length,pos=posOf(s);return{season:s,pos,size,y:pos!=null?pos:size+1.5,done:!!(seasonsData[s].champion||seasonsData[s].historical||(seasonsData[s].matches||[]).filter(m=>m.winner).length>=4)};});
  const pts=span.filter(p=>p.pos!=null);if(pts.length<2)return null;
  const maxY=Math.max(...span.map(p=>p.pos!=null?p.size+0.5:p.size+1.5),3);
  const H=64,pad={top:8,bottom:8,left:5,right:5};
  const X=i=>pad.left+(span.length>1?i/(span.length-1):0.5)*(w-pad.left-pad.right);

  const color=chartLineColor(clubCode);
  const sizeLine=span.map((p,i)=>`${X(i)},${Y(p.size+0.5)}`).join(' ');
  const near=e=>{const r=svgRef.current.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;let best=null,d=1e9;span.forEach((p,i)=>{const dd=Math.abs(X(i)-x);if(dd<d){d=dd;best=i;}});setHl(best);};
  const star=(cx,cy,size)=>{const a=[];for(let j=0;j<5;j++){const o=(j*72-90)*Math.PI/180,n=(j*72+36-90)*Math.PI/180;a.push(`${cx+size*Math.cos(o)},${cy+size*Math.sin(o)}`,`${cx+size*.4*Math.cos(n)},${cy+size*.4*Math.sin(n)}`);}return a.join(' ');};

      <polyline points={sizeLine} fill="none" stroke="#9ba099" strokeWidth="1.5" strokeDasharray="4,3" opacity="0.6"/>
      {span.slice(1).map((p,k)=>{const q=span[k];return<line key={'l'+k} x1={X(k)} y1={Y(q.y)} x2={X(k+1)} y2={Y(p.y)} stroke={color} strokeWidth="1" strokeLinecap="round" opacity={q.pos==null||p.pos==null?0.3:1}/>;})}
      {span.map((p,i)=>{if(p.pos==null)return<circle key={i} cx={X(i)} cy={Y(p.y)} r={hl===i?3:1.5} fill={color} opacity={hl===i?0.6:0.3}/>;const cx=X(i),cy=Y(p.pos),on=hl===i;
        return p.pos===1&&p.done?<polygon key={i} points={star(cx,cy,on?5:4)} fill="#f59e0b" stroke="#d97706" strokeWidth="0.5"/>:<circle key={i} cx={cx} cy={cy} r={on?3:1.5} fill={color}/>;})}

const PositionChart=({raceHistory,highlightIdx,setHighlightIdx,setView,clubCode})=>{
  const svgRef=React.useRef(null);
  
  // Reverse to show earliest first (left to right = old to new)
  const reversedHistory=[...raceHistory].reverse();
  const pts=reversedHistory.map((r,k)=>({pos:getNumericPos(r.pos),hist:raceHistory.length-1-k})).filter(p=>p.pos!=null);
  const positions=pts.map(p=>p.pos);
  if(positions.length<2)return null;
  
  const bestPos=Math.min(...positions);
  const maxPos=Math.max(...positions);
  const minPos=Math.min(...positions);
  
  const lineColor=chartLineColor(clubCode);
  
  const height=60;
  const padding={top:8,bottom:8,left:4,right:4};
  const chartHeight=height-padding.top-padding.bottom;
  
  const getX=(i,width)=>padding.left+(i/(positions.length-1))*(width-padding.left-padding.right);
  const getY=(pos)=>padding.top+((pos-minPos)/(maxPos-minPos||1))*chartHeight;
  
  const handleInteraction=(e)=>{
    const svg=svgRef.current;
    if(!svg)return;
    const rect=svg.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const x=clientX-rect.left;
    const width=rect.width;
    
    // Find nearest point
    let nearestIdx=0;
    let nearestDist=Infinity;
    positions.forEach((_,i)=>{
      const px=getX(i,width);
      const dist=Math.abs(px-x);
      if(dist<nearestDist){nearestDist=dist;nearestIdx=i;}
    });
    
    setHighlightIdx({historyIdx:pts[nearestIdx].hist});
  };
  
  const handleClick=(e)=>{
    if(highlightIdx){
      const race=raceHistory[highlightIdx.historyIdx]?.race;
      if(race?.results?.length){
        setView({type:'race',race});
      }
    }
  };
  
  const clearHighlight=()=>setHighlightIdx(null);
  const hlChart=highlightIdx?pts.findIndex(p=>p.hist===highlightIdx.historyIdx):-1;
  const hlWidth=svgRef.current?svgRef.current.getBoundingClientRect().width:0;
  const hl=hlChart>=0&&hlWidth?{chartIdx:hlChart,pos:positions[hlChart],x:getX(hlChart,hlWidth)}:null;
  
  return<div className="w-full mb-4 relative">
    <svg data-chart ref={svgRef} className="w-full cursor-pointer" style={{height}} role="img" aria-label="Chart of finishing positions in each race (every race is also listed in the race history table)" tabIndex={-1} onMouseMove={handleInteraction} onMouseLeave={clearHighlight} onClick={handleClick} onTouchStart={handleInteraction} onTouchMove={handleInteraction} onTouchEnd={clearHighlight}>
      <PathRenderer positions={positions} getY={getY} padding={padding} bestPos={bestPos} highlightIdx={hl?.chartIdx} lineColor={lineColor}/>
    </svg>
    {hl&&<div className="absolute bg-gray-800 text-white text-xs px-2 py-1 rounded pointer-events-none whitespace-nowrap" style={{left:hl.x,top:-4,transform:'translateX(-50%)'}}>{ordPos(hl.pos)}</div>}
  </div>;
};

const PathRenderer=({positions,getY,padding,bestPos,highlightIdx,lineColor})=>{
  const[width,setWidth]=React.useState(300);
  const pathRef=React.useRef(null);
  
  React.useEffect(()=>{
    const updateWidth=()=>{
      if(pathRef.current?.parentElement){
        setWidth(pathRef.current.parentElement.getBoundingClientRect().width);
      }
    };
    updateWidth();
    window.addEventListener('resize',updateWidth);
    return()=>window.removeEventListener('resize',updateWidth);
  },[]);
  
  const getX=(i)=>padding.left+(i/(positions.length-1))*(width-padding.left-padding.right);
  const points=positions.map((pos,i)=>`${getX(i)},${getY(pos)}`).join(' ');
  
  return<g ref={pathRef}>
    <polyline points={points} fill="none" stroke={lineColor} strokeWidth="1" strokeLinejoin="round"/>
    {positions.map((pos,i)=>{
      const cx=getX(i);
      const cy=getY(pos);
      const isHighlighted=highlightIdx===i;
      const isBest=pos===bestPos;
      if(isBest){
        // Star shape for best position(s) - yellow fill
        const size=isHighlighted?5:4;
        const starPoints=[];
        for(let j=0;j<5;j++){
          const outerAngle=(j*72-90)*Math.PI/180;
          const innerAngle=((j*72)+36-90)*Math.PI/180;
          starPoints.push(`${cx+size*Math.cos(outerAngle)},${cy+size*Math.sin(outerAngle)}`);
          starPoints.push(`${cx+size*0.4*Math.cos(innerAngle)},${cy+size*0.4*Math.sin(innerAngle)}`);
        }
        return<polygon key={i} points={starPoints.join(' ')} fill="#f59e0b" stroke="#d97706" strokeWidth="0.5" className="transition-all"/>;
      }
      return<circle key={i} cx={cx} cy={cy} r={isHighlighted?3:1.5} fill={lineColor} className="transition-all"/>;
    })}
  </g>;
};

      <h2 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">How it's measured</h2>
      <ul className="list-disc pl-5 space-y-1.5">
        <li><b className="text-gray-900 font-semibold">UK 5K rank</b> is each finisher's best position in Power of 10's UK road 5K rankings for the two calendar years leading into the race (2025 and 2026 for this season). Ranks are read to 3,000; anyone ranked lower, or not ranked, isn't counted. Because rank compares runners with everyone in the country that year, faster shoes don't inflate later seasons and men and women can be compared. But it also hides real growth: the UK has far more good runners than in 2016, so a top-1,000 place now takes about a minute more speed.</li>
        {rankFrom>firstSeason&&<li><b className="text-gray-900 font-semibold">Rank coverage so far:</b> {rankFrom} onwards. Earlier seasons are being added.</li>}
        <li><b className="text-gray-900 font-semibold">WA points</b> uses World Athletics' scoring tables (2025 edition), which give any time at any distance a points score, so a 31:22 10K and a 14:49 5K are both worth about 842 points for a man. Each finisher's score is their best over 3,000m, 5,000m and 10,000m on the track and 5K, 10K, 10 miles and the half marathon on the road, in the two calendar years leading into the race (or the year before that if they have none). The tables are built so that men's and women's points mean the same standard: 800 points is about 15:03 for a man over 5K and 18:25 for a woman. Like times, points measure absolute performance, so on their own later seasons score higher partly because shoes and racing have got faster.</li>
        {fd.drift&&<li><b className="text-gray-900 font-semibold">Era-adjusted points</b> (the default) take out that general speed-up using runners as their own yardstick. We followed about 1,400 men and 1,250 women who have points in at least three different years and measured how much the same people's scores moved from year to year, after allowing for how good each of them is. By 2024 and 2025 the same runners were scoring about {fd.drift.M['2025']} points more than in 2016 for men and {fd.drift.W['2025']} for women, roughly 10 to 12 seconds over 5K at the 800-point level. Each finisher's points are reduced by their year's amount, so every season is shown in 2016 terms. That speed-up is small next to how much the country has deepened: the 1,000th-best man over 5K in the UK went from 16:35 in 2016 to 15:21 in 2025, and the 1,000th woman from 20:37 to 18:38. So most of the rise in recent seasons is real: more good runners, not just faster shoes. The yardstick runners also get older over the decade, and young runners improving and older runners slowing don't cancel out exactly, so treat the adjustment as an estimate. Switch to “As run” to see unadjusted points.</li>}
        <li><b className="text-gray-900 font-semibold">5K form time</b> is the same measure as the <a href="/race/2627-1/form-guide" className="text-[#1b649e] underline decoration-gray-300 underline-offset-2">form guides</a>: each finisher's best 5K or 5,000m over the previous two years, with a time estimated from their road handicap where they have no recent 5K. It covers 2016/17 onwards (earlier seasons would need handicap histories we haven't collected), and later seasons look deeper partly because everyone has got faster.</li>
        <li><b className="text-gray-900 font-semibold">National top 100</b> is a cross-country check on the front of the field: how many finishers placed in the top 100 of the senior race at the English National Cross Country Championships in the calendar year the season started or the one after. Only about a quarter to two-fifths of men and a sixth to a third of women in a Surrey League race also run the National, and turnout depends on the venue (it is highest at Parliament Hill), so it says more about how stacked a race was than how deep. The 2013 and 2014 races were in Sunderland and Nottingham, so few Surrey League runners went. There was no National in 2021; the 2024 race was moved to September at Weston Park and had a much smaller field, and 2026 was at Sedgefield in County Durham.</li>
        <li>Races marked * weren't on Power of 10 (Beckenham January 2023, Wimbledon February 2026 and Wimbledon October 2026), so finishers were matched by name and a few will be missing. October 2026 handicaps aren't used, as Power of 10 recalculated them all in June 2026. Three women's races are also marked * (Richmond Park October 2010, Ham Lands January 2011 and Richmond Park December 2011): the archive's results are incomplete and Power of 10 has them only combined with Division 2, so Division 1 runners were picked out by club. Tested on a complete race, that finds about nine in ten correctly.</li>
        <li><b className="text-gray-900 font-semibold">2010/11 to 2015/16:</b> older Power of 10 results leave more finishers unlinked to a profile. We linked them by name where the name matches exactly one runner elsewhere in the league's results, but slightly fewer finishers have points (about 55–65%, against 60–75% later), and road 5Ks were rarer, so fewer have a UK 5K rank. Men's results start in 2012/13, because Power of 10 lists only part of each men's field before then. Women's start in 2010/11, and in 2012/13 and 2013/14 only the two races with full results in the archive are included.</li>
        <li>Women's fields are Division 1 only, separated from Power of 10's combined Division 1/2 results by name and time.</li>
        <li>Fewer races were held in 2020 and 2021, so Power of 10's rankings for those years are shorter: so ranks in those years flatter runners slightly. Some years' women's lists also end before 3,000 (several stop between about 1,500 and 2,500), which is why some women's lines go flat at the right.</li>
      </ul>
      {fd.updated&&<p className="text-xs text-gray-400 mt-4">Power of 10 data read {fd.updated}.</p>}
    </div>
  </div>;
};
